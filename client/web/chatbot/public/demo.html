<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chatbot demo</title>
</head>
<body>
  <h1>Chatbot widget demo</h1>
  <p>Open with <code>?key=YOUR_KEY</code></p>
  <script>
    const params = new URLSearchParams(location.search)
    const key = params.get('key') || 'REPLACE_ME'
    const s = document.createElement('script')
    s.src = (params.get('src') || '/widget.js')
    s.setAttribute('data-widget-key', key)
    s.async = true
    document.body.appendChild(s)
  </script>
</body>
</html>
