# docker-compose.local.yaml
# Local development with PostgreSQL and Redis
name: corteza-local
version: "3.8"

services:
  # Corteza Application
  corteza:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: corteza-local
    env_file:
      - server/.env
    ports:
      - "80:80"
    environment:
      # Database - PostgreSQL (using DATABASE_URL connection string)
      - DB_DSN=postgres://corteza:corteza@postgres:5432/corteza?sslmode=disable
      
      # Server
      - HTTP_ADDR=0.0.0.0:80
      - HTTP_WEBAPP_ENABLED=true
      - HTTP_WEBAPP_BASE_DIR=/corteza/webapp
      - HTTP_WEBAPP_LIST=admin,compose,workflow,reporter,privacy,discovery,one
      - HTTP_SERVER_WEB_CONSOLE_ENABLED=true
      
      # Domain
      - DOMAIN=localhost
      - DOMAIN_WEBAPP=localhost
      
      # Auth - disable for dev
      - AUTH_REQUEST_RATE_LIMIT=0
      - AUTH_PASSWORD_SECURITY=false
      
      # Debug logging
      - LOG_DEBUG=true
      - LOG_LEVEL=debug
      
      # Provisioning
      - PROVISION_ALWAYS=true
      - UPGRADE_ALWAYS=true
      
      # Disable some features for local dev
      - FEDERATION_ENABLED=false
      - APIGW_ENABLED=false
      
      # Required for locale service in development
      - ENVIRONMENT=dev
      - LOCALE_DEVELOPMENT_MODE=true
    volumes:
      - corteza-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - corteza-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: corteza-local-postgres
    environment:
      POSTGRES_USER: corteza
      POSTGRES_PASSWORD: corteza
      POSTGRES_DB: corteza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - corteza-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corteza"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  corteza-data:
    driver: local
  postgres_data:
    driver: local

networks:
  corteza-local:
    driver: bridge
