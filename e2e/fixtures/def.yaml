namespace:
  e2e_ns:
    name: E2E
    enabled: true
    modules:
      e2e_empty:
        name: E2E Empty
        fields:
          amount:
            title: Amount
            kind: Number
      e2e_guarded:
        name: E2E Guarded
        fields:
          subject:
            title: Subject
      e2e_items:
        name: E2E Items
        fields:
          title:
            title: Title
          amount:
            title: Amount
            kind: Number
        source:
          - from: items.csv
            key: ID
            map:
              - column: ID
                skip: true
              - column: title
                field: title
              - column: amount
                field: amount
    pages:
      e2e_dashboard:
        title: E2E Dashboard
        visible: true
        blocks:
          - title: Empty progress
            kind: Progress
            xywh: [0, 0, 6, 4]
            options:
              value:
                module: e2e_empty
                field: count
                operation: ''
              display:
                showValue: true
                showRelative: true
          - title: Items
            kind: RecordList
            xywh: [0, 4, 12, 10]
            options:
              module: e2e_items
              fields:
                - name: title
                - name: amount
              selectable: true
              bulkRecordEditEnabled: true
              editFields:
                - name: title
                - name: amount
      e2e_inline:
        title: E2E Inline
        visible: true
        blocks:
          - title: Inline items
            kind: RecordList
            xywh: [0, 0, 12, 10]
            options:
              module: e2e_items
              editable: true
              fields:
                - name: title
                - name: amount
              editFields:
                - name: title
                - name: amount
        layouts:
          e2e_inline_primary:
            primary: true
            blocks:
              - blockID: 1
                xywh: [0, 0, 48, 40]
      e2e_guarded_page:
        title: E2E Guarded
        visible: true
        blocks:
          - title: Guarded items
            kind: RecordList
            xywh: [0, 0, 12, 10]
            options:
              module: e2e_guarded
              editable: true
              fields:
                - name: subject
              editFields:
                - name: subject
        layouts:
          e2e_guarded_primary:
            primary: true
            blocks:
              - blockID: 1
                xywh: [0, 0, 48, 40]
      e2e_items_record:
        title: E2E Item
        module: e2e_items

# A before-update workflow that always fails with an error step carrying a
# title; used to check that the configured message and title reach the UI
workflows:
  e2e_order_check:
    meta:
      name: E2E order check
    enabled: true
    triggers:
      - resourceType: compose:record
        eventType: beforeUpdate
        constraints:
          - name: module.handle
            op: "="
            values:
              - e2e_guarded
        enabled: true
        stepID: 1
    steps:
      - id: 1
        kind: error
        arguments:
          - { target: message, type: String, value: "Order is not ready" }
          - { target: title, type: String, value: "Order check" }
