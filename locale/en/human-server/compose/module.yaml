errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  handleNotUnique: handle not unique
  invalidHandle: invalid handle
  invalidID: invalid ID
  invalidNamespaceID: invalid or missing namespace ID
  nameNotUnique: name not unique
  fieldNameReserved: field name reserved
  defaultSchemaAlteration: "The fields {{fields}} would need their own columns in the shared record table, which can't be added. Leave their data store encoding at the default (JSON), or move the module to its own data store."
  fieldLocked: The field {{field}} already has records saved in it, so its name and type can't be changed. Add a new field instead.
  namespaceNotFound: namespace does not exist
  notAllowedToCreate: not allowed to create modules
  notAllowedToDelete: not allowed to delete this module
  notAllowedToListModules: not allowed to list modules
  notAllowedToRead: not allowed to read this module
  notAllowedToReadNamespace: not allowed to read this namespace
  notAllowedToSearch: not allowed to search or list modules
  notAllowedToUndelete: not allowed to undelete this module
  notAllowedToUpdate: not allowed to update this module
  notFound: module does not exist
  staleData: module was modified by someone else or by a workflow after you've opened it. Please refresh to see the latest updated version
  dedupConfigurationInvalidMissingConstraint: missing constraints on deduplication configuration
