errors:
  cyclicPath: A user group can't report to itself or to a group below it. Pick a parent group that isn't under this one.
  duplicatePathName: Each group this user group reports to needs a different relationship name.
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  handleNotUnique: Another user group already uses this handle.
  hasChildGroups: Other user groups still report to this one. Make them report to a different group before deleting it.
  hasMembers: This user group still has members. Move them to other groups before deleting it.
  invalidHandle: This handle isn't valid. A handle has at least 2 characters, starts with a letter, ends with a letter or number, and uses only letters, numbers, underscores, dashes and dots.
  invalidID: The user group ID is missing or isn't valid.
  invalidSelfID: A parent group link is empty, or the root user group was given a parent. Pick a parent for every link; the root group can't have one.
  invalidUpdateStructure: The user group hierarchy isn't valid after this change.
  missingSelfID: Every user group except the root needs a group to report to. Pick at least one parent group.
  nameNotUnique: Another user group already uses this name.
  notAllowedToCreate: You don't have permission to create user groups.
  notAllowedToDelete: You don't have permission to delete this user group.
  notAllowedToListUserGroups: You don't have permission to list user groups.
  notAllowedToManageMembers: You don't have permission to manage this user group's members.
  notAllowedToRead: You don't have permission to view this user group.
  notAllowedToSearch: You don't have permission to search or list user groups.
  notAllowedToUndelete: You don't have permission to restore this user group.
  notAllowedToUpdate: You don't have permission to change this user group.
  notFound: This user group doesn't exist or has been deleted.
  parentNotFound: A group this user group should report to doesn't exist or has been deleted. Pick another parent group.
  staleData: Someone else, or a workflow, changed this user group after you opened it. Refresh to see the latest version.
