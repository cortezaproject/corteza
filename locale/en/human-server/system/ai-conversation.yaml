errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidID: The AI conversation ID is missing or isn't valid.
  notAllowedToCreate: You don't have permission to create AI conversations.
  notAllowedToDelete: You don't have permission to delete this AI conversation.
  notAllowedToRead: You don't have permission to view this AI conversation.
  notAllowedToSearch: You don't have permission to search or list AI conversations.
  notAllowedToUpdate: You don't have permission to change this AI conversation.
  notFound: This AI conversation doesn't exist or has been deleted.
  staleData: Someone else changed this AI conversation after you opened it. Refresh to see the latest version.
