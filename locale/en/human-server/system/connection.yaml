errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  handleNotUnique: Another connection already uses this handle.
  hasActiveConnections: This connection is still in use. Remove what uses it before deleting it.
  invalidID: The connection ID is missing or isn't valid.
  missingAuthMethod: The connection needs an authentication method.
  missingBaseURL: The connection needs a base URL.
  missingShortName: The connection needs a name.
  notAllowedToCreate: You don't have permission to create connections.
  notAllowedToDelete: You don't have permission to delete this connection.
  notAllowedToRead: You don't have permission to view this connection.
  notAllowedToSearch: You don't have permission to search connections.
  notAllowedToUndelete: You don't have permission to restore this connection.
  notAllowedToUpdate: You don't have permission to change this connection.
  notFound: This connection doesn't exist or has been deleted.
