errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidID: The translation ID is missing or isn't valid.
  notAllowedToManage: You don't have permission to manage translations.
  notAllowedToRead: You don't have permission to view this translation.
  notAllowedToSearch: You don't have permission to search or list translations.
  notFound: This translation doesn't exist or has been deleted.
  staleData: Someone else, or a workflow, changed this translation after you opened it. Refresh to see the latest version.
