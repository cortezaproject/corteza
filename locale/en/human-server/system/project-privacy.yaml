errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidID: The privacy item ID is missing or isn't valid.
  invalidRevision: That revision doesn't belong to this project.
  missingProject: A privacy item needs a project.
  notAllowedToCreate: You don't have permission to create privacy items.
  notAllowedToDelete: You don't have permission to delete this privacy item.
  notAllowedToRead: You don't have permission to view this privacy item.
  notAllowedToSearch: You don't have permission to search or list privacy items.
  notAllowedToUpdate: You don't have permission to change this privacy item.
  notFound: This privacy item doesn't exist or has been deleted.
  staleData: Someone else changed this privacy item after you opened it. Refresh to see the latest version.
