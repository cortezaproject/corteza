errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidID: The review ID is missing or isn't valid.
  invalidRevision: That revision doesn't belong to this project.
  missingProject: A review needs a project.
  notAllowedToCreate: You don't have permission to create reviews.
  notAllowedToDelete: You don't have permission to delete this review.
  notAllowedToRead: You don't have permission to view this review.
  notAllowedToSearch: You don't have permission to search or list reviews.
  notAllowedToUpdate: You don't have permission to change this review.
  notFound: This review doesn't exist or has been deleted.
  staleData: Someone else changed this review after you opened it. Refresh to see the latest version.
