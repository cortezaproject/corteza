errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidHandle: This handle isn't valid. A handle has at least 2 characters, starts with a letter, ends with a letter or number, and uses only letters, numbers, underscores, dashes and dots.
  invalidID: The knowledge base ID is missing or isn't valid.
  notAllowedToCreate: You don't have permission to create knowledge bases.
  notAllowedToDelete: You don't have permission to delete this knowledge base.
  notAllowedToRead: You don't have permission to view this knowledge base.
  notAllowedToSearch: You don't have permission to search or list knowledge bases.
  notAllowedToUpdate: You don't have permission to change this knowledge base.
  notFound: This knowledge base doesn't exist or has been deleted.
  staleData: Someone else changed this knowledge base after you opened it. Refresh to see the latest version.
