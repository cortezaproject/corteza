errors:
  conversationScenarioMissingAgent: A conversation scenario needs an agent. Pick one for every conversation scenario.
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidHandle: This handle isn't valid. A handle has at least 2 characters, starts with a letter, ends with a letter or number, and uses only letters, numbers, underscores, dashes and dots.
  invalidID: The chatbot ID is missing or isn't valid.
  notAllowedToCreate: You don't have permission to create chatbots.
  notAllowedToDelete: You don't have permission to delete this chatbot.
  notAllowedToRead: You don't have permission to view this chatbot.
  notAllowedToSearch: You don't have permission to search or list chatbots.
  notAllowedToUpdate: You don't have permission to change this chatbot.
  notFound: This chatbot doesn't exist or has been deleted.
  staleData: Someone else changed this chatbot after you opened it. Refresh to see the latest version.
