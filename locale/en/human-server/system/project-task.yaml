errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidID: The task ID is missing or isn't valid.
  invalidRevision: That revision doesn't belong to this project.
  missingProject: A task needs a project.
  notAllowedToCreate: You don't have permission to create tasks.
  notAllowedToDelete: You don't have permission to delete this task.
  notAllowedToRead: You don't have permission to view this task.
  notAllowedToSearch: You don't have permission to search or list tasks.
  notAllowedToUpdate: You don't have permission to change this task.
  notFound: This task doesn't exist or has been deleted.
  staleData: Someone else changed this task after you opened it. Refresh to see the latest version.
