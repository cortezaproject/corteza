errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidID: The feature ID is missing or isn't valid.
  invalidRevision: That revision doesn't belong to this project.
  missingProject: A feature needs a project.
  notAllowedToCreate: You don't have permission to create features.
  notAllowedToDelete: You don't have permission to delete this feature.
  notAllowedToRead: You don't have permission to view this feature.
  notAllowedToSearch: You don't have permission to search or list features.
  notAllowedToUpdate: You don't have permission to change this feature.
  notFound: This feature doesn't exist or has been deleted.
  staleData: Someone else changed this feature after you opened it. Refresh to see the latest version.
