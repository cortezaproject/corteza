errors:
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  invalidHandle: This handle isn't valid. A handle has at least 2 characters, starts with a letter, ends with a letter or number, and uses only letters, numbers, underscores, dashes and dots.
  invalidID: The agent ID is missing or isn't valid.
  missingName: The agent needs a name.
  notAllowedToCreate: You don't have permission to create agents.
  notAllowedToDelete: You don't have permission to delete this agent.
  notAllowedToRead: You don't have permission to view this agent.
  notAllowedToSearch: You don't have permission to search or list agents.
  notAllowedToUpdate: You don't have permission to change this agent.
  notFound: This agent doesn't exist or has been deleted.
  staleData: Someone else changed this agent after you opened it. Refresh to see the latest version.
