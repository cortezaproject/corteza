errors:
  disabled: This TAQ or its trigger is turned off.
  generic: Something went wrong on the server, so the request couldn't be completed. Try again, and contact your administrator if it keeps happening.
  handleNotUnique: Another TAQ already uses this handle.
  invalidHandle: This handle isn't valid. A handle has at least 2 characters, starts with a letter, ends with a letter or number, and uses only letters, numbers, underscores, dashes and dots.
  invalidID: The TAQ ID is missing or isn't valid.
  maximumCallStackSizeExceeded: This TAQ called itself too many times and was stopped. Check for TAQs that call each other in a loop.
  missingName: The TAQ needs a name.
  notAllowedToCreate: You don't have permission to create TAQs.
  notAllowedToDelete: You don't have permission to delete this TAQ.
  notAllowedToExecute: You don't have permission to run this TAQ.
  notAllowedToExecuteCorredorStep: This TAQ has a Corredor step, but Corredor is turned off on this server.
  notAllowedToRead: You don't have permission to view this TAQ.
  notAllowedToSearch: You don't have permission to search or list TAQs.
  notAllowedToUndelete: You don't have permission to restore this TAQ.
  notAllowedToUpdate: You don't have permission to change this TAQ.
  notFound: This TAQ doesn't exist or has been deleted.
  staleData: Someone else, or a TAQ, changed this TAQ after you opened it. Refresh to see the latest version.
  unknownNgAutomationStep: This TAQ has a step the server doesn't recognise.
