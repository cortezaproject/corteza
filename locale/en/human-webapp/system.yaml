      sensitivityLevelID:
        hint: Select the highest allowed sensitivity level for this data source
    properties:
      form:
        data-at-rest-encryption:
          checkbox:
            description: Declare that stored data on this data source is encrypted on disk (e.g. full-disk encryption, tablespace or volume-level encryption). Documentation only — does not enable encryption.
            label: Data at rest is encrypted
          notes:
            description: Internal notes on data-at-rest encryption (disk encryption)
            label: Notes on encryption
        data-at-rest-protection:
          checkbox:
            description: Declare that the underlying storage is physically and operationally protected (locked facility, restricted access, hardened hosting environment). Documentation only.
            label: Storage is physically protected
          notes:
            description: Internal notes on data-at-rest protection (physical protection)
            label: Notes on data at rest protection
        data-at-transit-encryption:
          checkbox:
            description: Declare that connections to this data source are encrypted in transit (e.g. TLS/SSL on the wire between clients and the database). Documentation only — does not enable TLS.
            label: Data in transit is encrypted
          notes:
            description: Internal notes on data-at-transit encryption (network encryption)
            label: Notes on data at transit encryption (network encryption)
        data-restoration:
          checkbox:
            description: Declare that backups of this data source are taken regularly and that a tested restore procedure exists. Documentation only — does not schedule backups.
            label: Backups and restore are in place
          notes:
            description: Internal notes on data-restoration
            label: Notes on data restoration
