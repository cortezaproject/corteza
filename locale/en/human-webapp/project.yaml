    description: Builds part or all of the project and its AI systems, and requests governance approval before publishing to production.
  governance-owner:
    label: Governance Owner
    resources: All Pages
    description: Owns project governance and grants approval before every publish to production.
  security-owner:
    label: Security Owner
    resources: RBAC, Security
    description: Responsible for RBAC and security configuration; grants approval before publishing to production.
  junior-developer:
    label: Junior Developer
    resources: Technical Architecture, Data Model, Connections, Automations
    description: Builds the technical architecture, data model, connections and automations. Cannot request or grant approvals.
  executive-authority:
    label: Executive Authority
    resources: Read all, Approve publishing
    description: >-
      Has read access across the project and signs off on every publish to production, from the
      first release through every later revision.
  infrastructure-administrator:
    label: Infrastructure Administrator
    resources: —
    description: >-
      Responsible for setting up the server infrastructure, and installing and maintaining the
      platform software, including platform-level software updates.
