qms:
  article17: Article 17
  title: Quality Management System
  items:
    a:
      body: >-
        @Human Governance is an AI Compliance-as-Infrastructure tooling layer to deliver an
        out-of-the-box strategy for AI regulatory compliance, including compliance with conformity
        assessment procedures and procedures for the management of modifications to the high-risk
        AI systems.
      point1: Conformity Assessment Procedures are documented and implemented in the Conformity Assessment section.
      point2: Management of modifications to a high-risk AI system in production must go through a gated change management procedure documented in the Incident, Issue and Change Management section.
      point3: By following the full gated development process for AI Systems, EU AI Act Annex IV documentation will be programmatically delivered and updated (after change management).
    b:
      body: Techniques, procedures and systematic actions to be used for the design, design control and design verification of high-risk AI systems.
    c:
      body: Techniques, procedures and systematic actions to be used for the development, quality control and quality assurance of high-risk AI systems.
      point1: '@Human Governance delivers a wizard-like user journey for building high-risk AI systems.'
      point2: 'The design and development process for any high-risk AI system project is gated for governance verification at multiple strategic points: 1. Executive Authority is required to sign off the project after the Project Summary, Quality Management Systems and Project Members have been defined; 2. etc.'
      point3: After an AI System Project is in production, changes can only be made via a request, approval and review system.
      point4: Multi-factor authentication is enforced for all Project Members.
    d:
      body: Examination, test and validation procedures to be carried out before, during and after the development of the high-risk AI system, and the frequency with which they have to be carried out.
    e:
      body: Technical specifications, including standards, to be applied and, where the relevant harmonised standards are not applied in full or do not cover all of the relevant requirements set out in Section 2, the means to be used to ensure that the high-risk AI system complies with those requirements.
      point1Text: '@Human Governance is 100% open-source and can be inspected at'
      point2Text: '@Human Governance documentation is 100% open and can be inspected at'
      point3: High-level technical architecture for any AI System Project is available to download in the project documentation section.
      point4: Configuration files for any individual AI System Project are available to download in the project documentation section.
    f:
      body: Systems and procedures for data management, including data acquisition, data collection, data analysis, data labelling, data storage, data filtration, data mining, data aggregation, data retention and any other operation regarding the data that is performed before and for the purpose of the placing on the market or the putting into service of high-risk AI systems.
      point1: A Data Access Layer (DAL) is used to connect to third-party Postgres, MySQL (and variants) and Microsoft SQL Server databases. The DAL may also connect to third-party databases via API. The third-party database schema must be programmatically mapped to the @Human data schema and field types.
      point2: An Application Connection layer allows connection to third-party web applications via API using standard REST methods. This can be bidirectional and all connections must be programmatically mapped to the @Human data schema and field types.
      point3: All fields in any data model must be labelled for their Sensitivity level.
      point4: All local data is stored in a Postgres database. Data at rest should be encrypted.
      point5: The Application layer only provides soft-deletes of data. Hard (i.e. permanent) data deletion must be provided at the database layer.
    g:
      body: Each AI System Project has its own documented Risk Management System section.
    h:
      body: The setup, implementation and maintenance of a post-market monitoring system are documented in the Monitoring section.
    i:
      body: Procedures related to the reporting of a serious incident are documented in the Incident, Issue and Change Management section.
    j:
      body: The handling of communication with national competent authorities, other relevant authorities, including those providing or supporting the access to data, notified bodies, other operators, customers or other interested parties.
    k:
      body: Systems and procedures for record-keeping of all relevant documentation and information.
    l:
      body: Resource management, including security-of-supply related measures.
      point1: Documented in the Resource Management section.
    m:
      body: An accountability framework setting out the responsibilities of the management and other staff with regard to all the aspects listed in this Quality Management System.
      point1: Documented in the Members section.
