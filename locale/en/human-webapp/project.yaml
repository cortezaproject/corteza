# Project lifecycle status (display only — raw value is what persists).
status:
  draft: Draft
  active: Active
  published: Published
  archived: Archived
  suspended: Suspended
  deprecated: Deprecated
# Compact status initials for the sidebar tag ("Dp" keeps deprecated distinct
# from draft's "D"; archived has no key — it is never shown in the sidebar).
statusShort:
  draft: D
  active: A
  published: P
  suspended: S
  deprecated: Dp
list:
  title: Projects
  searchPlaceholder: Search projects…
  filterByStatus: Filter by status
  resourceSingle: project
  resourcePlural: projects
  noItems: No projects yet.
  newProject: New Project
  untitled: Untitled project
  columns:
    updatedAt: Last modified
  actions:
    rename: Rename
    archive: Archive
    unarchive: Unarchive
  confirmDelete:
    header: Delete project
    message: 'Delete "{name}"? This can''t be undone.'
    accept: Delete
  toast:
    created: Project created
    renamed: Project renamed
    archived: Project archived
    unarchived: Project unarchived
    deleted: Project deleted
    actionFailed: Action failed
viewProject: View project
viewDashboard: View dashboard
viewOverview: Project overview
overview:
  fallbackName: Project
  title: '{name} — overview'
  blurb: Read-only overview / versions for published projects (later screen).
  backToProjects: Back to projects
  openWizard: Open wizard
dashboard:
  # The dashboard surface itself, as a destination — used by the revision
  # switcher's "Dashboard" entry (the chain-wide view, as opposed to a single
  # revision's wizard) and as a last-resort route-meta title fallback. Distinct
  # from views.overview, which names the landing SECTION within it.
  title: Dashboard
  version: 'v{number}'
  versionDraft: 'v{number} draft'
  # Which revision a work item belongs to — shown as a column in the
  # chain-wide list views (BacklogView.vue/CategoryView.vue), which span every
  # revision in the chain now. Assigned items reuse `version` above; this
  # covers items with no revisionID (legitimately unassigned).
  revision:
    unassigned: Unassigned
  nav:
    monitor: Monitor
    categories: Categories
    insights: Insights
  views:
    overview: Overview
    board: Board
    activity: Activity
    reports: Reports
    backlog: Backlog
  # Overview page (category cards + activity trend) loading/error states.
  overview:
    error: Couldn't load the project overview. Please try again.
    retry: Retry
    # Heading above the KPI trio when the overview is scoped to one revision.
    kpiHeading: Key numbers
  # Real action-log view (Activity — the project's audit trail), rendered as an
  # activity timeline. Filter/severity/detail labels are reused from
  # system.actionlog.list.*; only the header, timeline chrome and empty states
  # live here. Shared by the dashboard route (chain-wide) and the wizard's
  # Manage & Monitor Activity section (revision-scoped) — see
  # components/dashboard/ActivityPanel.vue.
  activity:
    title: Activity
    desc: Audit and action log for this project workspace.
    searchPlaceholder: Search events…
    filters: Filters
    refresh: Refresh
    clearAll: Clear all
    # Day-group headings above the timeline.
    today: Today
    yesterday: Yesterday
    unknownDate: Unknown date
    end: That's the whole history.
    # Actor fallback when an event has no user behind it (system/automation).
    system: System
    details: Show details
    # Reveals the changed fields the row does not have room for; {count} is how
    # many are hidden.
    moreChanges: 1 more change | {count} more changes
    diff:
      empty: (empty)
    # Empty states. This view is legitimately empty more often than most, and for
    # non-obvious reasons, so the hints explain why rather than leaving a dead end.
    empty: No events recorded yet.
    emptyHint: Events appear here when someone creates, updates or deletes a resource in this
      project. Viewing and listing are not recorded, and activity from before event
      tracking was enabled is not shown.
    emptyFiltered: No events match your filters.
    emptyFilteredHint: Try widening the time range or clearing a filter.
    # Metrics band above the timeline (respects the active filters).
    metrics:
      events: Events
      people: People
      errors: Errors
  # The board — every work item as a card in one of four shared status
  # columns, drag-to-move between them. Shared by the dashboard route
  # (chain-wide) and the wizard's Manage & Monitor Board section
  # (revision-scoped) — see components/dashboard/BoardPanel.vue. Column
  # headers render the raw status strings themselves (config/eventForm.js
  # EVENT_STATUS): like every other status pill in this section, status is an
  # enum value that persists to the backend, not translated copy.
  board:
    title: Board
    desc: Work items grouped by status — drag a card to move it between statuses.
    # A column's "load more" affordance (BoardColumn.vue) — shown once its
    # server-paged next page (see BoardPanel.vue's loadMoreColumn) is loading
    # or ready to fetch.
    loadMore: Load more
    toast:
      moveFailed: Could not move the item. Please try again.
      loadMoreFailed: Could not load more items. Please try again.
  # Quick time-range presets (stock-chart style), shared by ActivityPanel's
  # toolbar and the Overview/CategoryView trend charts (see TimeRangeSelect).
  range:
    d1: 1D
    d5: 5D
    m1: 1M
    m6: 6M
    ytd: YTD
    y1: 1Y
    y5: 5Y
    all: All
  # "+ New {type}" button label; {type} is a category singular below.
  newButton: 'New {type}'
  # Singular category nouns used in buttons/dialog titles.
  categorySingular:
    incident: Incident
    feature: Feature
    privacy: Privacy request
    task: Task
    review: Review
  # KPI stat-card labels on each category page.
  kpi:
    total: Total
    open: Open
    overdue: Overdue
  # Bar-chart card titles (grouped-by field; titles are the bare dimension
  # name, no "By " prefix).
  chart:
    byStatus: 'Status'
    byType: 'Type'
    byRequestType: 'Request type'
    byTaskType: 'Task type'
    byReviewType: 'Review type'
    byFeatureType: 'Feature type'
    bySeverity: 'Severity'
    byRisk: 'Risk'
    byCategory: 'Category'
    byPriority: 'Priority'
    # Section heading + titles for the created-over-time trend charts.
    activity: Activity
    trend: New items over time
    createdOverTime: Created over time
    # Throughput trend on the manage tab's metrics panel. Note only incidents
    # and tasks carry a real completion date; the other types fall back to
    # their last-updated timestamp, so this reads as a trend, not a record.
    completedOverTime: Completed over time
    # ChartLegend.vue's toggle buttons — aria-label only (the pill itself
    # already shows the label visually), so these read as a full sentence.
    legend:
      hide: 'Hide {label} in chart'
      show: 'Show {label} in chart'
  # Overview "Events" band — audit activity summary + recent feed (admin-only).
  eventsBand:
    title: Events
    recent: Recent activity
    viewAll: View all
    noRecent: No recent activity yet.
  # Extra CResourceList column headers not covered by event.f.*.
  columns:
    title: Title
    severity: Severity
    risk: Risk
    revision: Revision
  # CResourceList chrome for category pages, shared by BacklogView.vue's own
  # list (same toolbar idiom: chips left; filter → refresh → search right).
  # There used to be an Unassigned filter (button + popover + removable chip)
  # here too — dropped when these lists moved to server-side paging: the
  # generated resource filters treat `revisionID = 0` as "no constraint", not
  # "unassigned only", so there's no honest way to serve it server-side (see
  # CategoryPanel.vue/BacklogView.vue's own module doc comments).
  list:
    searchPlaceholder: 'Search…'
    empty: 'Nothing here yet.'
  categories:
    incident: Incidents
    feature: Features
    privacy: Privacy
    task: Tasks
    review: Reviews
    incidents: Incidents
    features: Features
    tasks: Tasks
    reviews: Reviews
  stub:
    comingSoon: This view is coming soon.
  # Backlog view — every ProjectBacklogItem across every category, as a flat
  # table (see views/dashboard/BacklogView.vue), plus the field labels shared
  # by BacklogItemDialog and the inline sections in EventDetailDialog /
  # NewEventDialog.
  backlog:
    title: Backlog
    desc: Follow-up work items linked to events across every category.
    searchPlaceholder: 'Search backlog…'
    empty: No backlog items yet.
    emptyHint: Create a backlog item here, or add one from any event's detail panel.
    newButton: New item
    singular: Backlog item
    untitled: Untitled item
    columns:
      linkedEvent: Linked event
    f:
      category: Category
      linkedEvent: Linked event
      assignee: Assignee
      priority: Priority
    section:
      title: Backlog items ({count})
      addItem: Add item
    confirmDelete:
      header: Delete backlog item
      message: 'Delete "{name}"? This can''t be undone.'
    toast:
      created: Backlog item created
      createFailed: Could not create the backlog item. Please try again.
      updated: Backlog item updated
      updateFailed: Could not save the changes. Please try again.
      deleted: Backlog item deleted
      deleteFailed: Could not delete the backlog item. Please try again.
  event:
    title: New Event
    step1: Select the type of event you want to create.
    step2: 'New {category}'
    back: Back
    create: Create event
    untitled: Untitled event
    toast:
      created: Event created
      createFailed: Could not create the event. Please try again.
      updated: Event updated
      updateFailed: Could not save the changes. Please try again.
      deleted: Event deleted
      deleteFailed: Could not delete the event. Please try again.
    confirmDelete:
      header: Delete event
      message: 'Delete "{name}"? This can''t be undone.'
    validation:
      required: This field is required.
    # Inline "Step 3 — Add Backlog Items" widget in NewEventDialog — queues
    # follow-up work titles, created alongside the event once it's saved.
    backlogWidget:
      title: Backlog items
      placeholder: 'Backlog item title…'
    categories:
      incident:
        label: Incident / Issue
        desc: Log a security incident or operational issue that needs investigation and corrective action.
      feature:
        label: New Feature / Update
        desc: Record a new capability or change being introduced to the system.
      privacy:
        label: Privacy Request
        desc: Handle a GDPR or data-subject request — access, rectification or deletion.
      task:
        label: Task / Review
        desc: Track an operational task, action item or audit that needs to be completed.
      review:
        label: Periodic Review
        desc: Schedule a periodic compliance, risk or access-control review.
    f:
      incidentType: Incident Type
      groupSystem: Group / System
      description: Description
      riskIssue: Risk Assessment of Issue
      changeRequired: Change Required / Corrective Action
      riskChange: Risk Assessment of Change
      issueOwner: Issue Owner
      changeOwner: Change Owner
      status: Status
      changeApprovedBy: Change Approved By
      dateDue: Date Due
      completedDate: Completed Date
      featureType: Feature Type
      riskFeature: Risk Assessment of Feature
      featureOwner: Feature Owner
      requestType: Request Type
      riskAssessment: Risk Assessment
      requestOwner: Request Owner
      taskName: Task Name
      taskType: Task Type
      owner: Owner
      reviewType: Review Type
      reviewFrequency: Review Frequency
      scope: Scope & Objectives
      reviewer: Reviewer
      approvedBy: Approved By
      # The revision this item is assigned to (config/eventForm.js
      # REVISION_FIELD) — shared by every category's New/Detail form plus
      # BacklogItemDialog. Options are the project's revision chain, labeled
      # the same 1-based way as `dashboard.version`, plus an explicit
      # `dashboard.revision.unassigned` entry to clear the assignment.
      revision: Revision
    # Placeholder text for the New Event forms above. Shared fields (title) have
    # one entry; fields whose hint text differs per category (description,
    # changeRequired, riskChange) are nested under that category.
    placeholder:
      title: Short, descriptive title…
      incident:
        description: Describe the incident in detail…
        riskIssue: Identify the risk, impact, likelihood, and affected parties…
        changeRequired: What corrective action or change is required?…
        riskChange: Assess the risk of implementing the proposed change…
      feature:
        description: Describe the feature or update…
        riskFeature: Assess the risk introduced by this feature…
        changeRequired: Any mitigations or changes required?…
        riskChange: Risk of the corrective change…
      privacy:
        description: Describe the privacy request…
        riskAssessment: GDPR / AI Act risk considerations…
        changeRequired: Data deletion steps, systems to update…
        riskChange: Any downstream impact of fulfilling the request…
      task:
        description: Detail what needs to be done…
      review:
        scope: What will be reviewed and what outcomes are expected…
# The wizard's Manage & Monitor tab left rail (see config/manageNav.js) —
# section headers and monitor-group item labels. Category item labels reuse
# the shared dashboard.categories.* keys above: same five categories, same
# wording, on both the live dashboard and this per-revision surface.
manage:
  nav:
    monitor: Monitor
    categories: Categories
  views:
    overview: Overview
    board: Board
    activity: Activity
  # The overview panel — components/dashboard/OverviewPanel.vue, shared with
  # the live dashboard and scoped to the open revision here. It replaced the
  # separate Metrics panel (retired 2026-07-28).
  overview:
    blurb: Work items assigned to this revision, summarized by category, key numbers and activity
      over time.
  # The activity panel — components/dashboard/ActivityPanel.vue, shared with
  # the live dashboard and scoped to the open revision here once the backend
  # actionlog revisionID filter lands (see ActivityPanel.vue's revisionId prop
  # comment). Work items (incidents, features, privacy requests, tasks,
  # reviews) are filed against the project chain, not a single revision, so
  # their audit events are never revision-attributable — only this revision's
  # own build artifacts (namespaces, workflows, agents, etc.) actually narrow.
  activity:
    blurb: This revision's own build-artifact activity — namespaces, workflows, agents and the
      like. Work items are filed against the project as a whole rather than a single revision, so
      their activity isn't shown here; see the project-wide dashboard for the full picture.
  # Placeholder body for the sections that aren't built yet (the five
  # per-category panels) — see components/wizard/manage/ManagePlaceholder.vue.
  panel:
    comingSoon: This section isn't built yet.
  # The metrics panel — components/wizard/manage/ManageMetrics.vue. Scoped to
  # the open revision, same as the board.
  metrics:
    blurb: Work items assigned to this revision, summarized by status, priority and completion over
      time.
    empty:
      title: No work items assigned to this revision yet.
      hint:
        Work items are filed against the project, then assigned to a revision individually — like
        an issue assigned to a milestone. None have been assigned to this revision yet, so there are
        no metrics to show.
  # NOTE: no manage.board.* block — ManageBoard.vue is a thin mount of
  # BoardPanel.vue with no header/blurb of its own (unlike overview/activity
  # above), so the board's copy (title/desc/toast) lives entirely under
  # dashboard.board.* and is shared as-is by both scopes. Its old
  # "no work items assigned to this revision yet" note (manage.board.empty.*)
  # was dropped as redundant on top of the per-column empty affordance,
  # which already carries that message (project.dashboard.list.empty).
sidebar:
  projects: Projects
newDialog:
  headerDetails: Project details
  headerDeployer: Deployer categories
  namePlaceholder: e.g. CRM & Sales
  descriptionPlaceholder: Optional short description
  createProject: Create project
  toastCreateFailed: Could not create project
renameDialog:
  header: Rename project
deployer:
  prompt: Is your organisation one or more of the following three categories of Deployers?
  questions:
    publicAuthorityAnnex3: >-
      A public authority deploying high-risk AI systems in the areas listed in AI Act Annex 3,
      specifically biometrics, education and vocational training, employment, access to and
      enjoyment of essential private and public services, law enforcement, migration, asylum and
      border control management, administration of justice and democratic processes.
    privateEssentialServices: A private entity providing essential public services.
    insuranceBanking: >-
      An insurance or banking company using AI to price life and health insurance and evaluate
      the creditworthiness of natural persons.
wizard:
  fallbackName: Project
  toastLoadFailed: Could not load project
  stepCounter: '{index} / {count}'
  toolbar:
    projects: Projects
    previous: Previous
    # Opens the project members dialog (see project.members.dialogHeader) —
    # members are no longer a wizard step, just a topbar button next to the
    # publish approval cluster (see project.publish below).
    members: Members
  # Revision switcher — replaces the old static version Tag Teleported to the
  # app topbar. Lists every revision in the open project's chain (see
  # stores/projects.js listRevisions/createRevision/revisionsFor and the
  # "Lifecycle & revisions" locked contract in project.intent.md), each
  # showing its 1-based version (project.dashboard.version above) and
  # lifecycle status (project.status above), with the open one marked. The
  # last entry branches a new draft off an active revision — disabled, never
  # left to fail, whenever the backend would reject it: the open revision
  # isn't active, or the chain already has a draft (one draft per chain).
  revisionSwitcher:
    trigger: Switch to another revision of this project, or start a new one
    newRevision: New revision from this one
    newRevisionDisabledNotActive: >-
      Only an active revision can branch a new draft — publish this revision first.
    newRevisionDisabledDraftExists: >-
      This chain already has a draft revision — open or publish it before starting another.
    toastCreateFailed: Could not create a new revision. Please try again.
  # Three fixed tabs, shown to every member regardless of capability — only
  # the review actions inside them (per-step Approve/Request changes, and the
  # project-level Request approval/Approve/Publish cluster) are
  # capability-gated. Build and Govern each carry their own step sidebar (see
  # config/pipeline.js's `tab` field); Manage & Monitor deliberately has no
  # steps — it renders its own left rail from config/manageNav.js instead, and
  # its labels live under project.manage.* rather than here.
  tabs:
    build: Build
    govern: Govern
    manageMonitor: Manage & Monitor
    publish: Publish
  # Per-step "Request changes" and "Approve" — available on every Build/Govern
  # step, any current status, any time, for a member with grant-approval
  # capability. There is no per-step submit stage: approving directly needs no
  # dialog (see the approve keys below), and requesting changes needs only a
  # note. Publish is not a step here any more — it keeps its own dedicated
  # submit → approve/request-changes cycle around the project as a whole (see
  # publish above), surfaced in the wizard's topbar toolbar cluster.
  requestChanges:
    action: Request changes
    dialog:
      header: Request changes on “{step}”
      label: What needs to change on this step?
      placeholder: Explain what should be revised here before it's considered ready again.
      confirm: Send back
    toast:
      sent: >-
        Changes requested — this step stays flagged until a reviewer approves it again. If the
        project's publish was already requested or approved, that's sent back for review too.
  approve:
    action: Approve
    toast:
      approved: Step approved
  toast:
    saved: Saved
    actionFailed: Action failed
  blurb:
    summary: Fill in the project's name, purpose and organisational role, then save.
    resourceManagement: Declare the permitted AI providers, infrastructure and third-party connections, then save. Later steps choose from these.
    dataModel: Define the modules (data tables) that hold your project's data, along with the fields on each.
    dataSensitivity: Classify every field by its data sensitivity level so governance and access controls can protect it appropriately.
    connections: Connect the external systems and data sources this project draws on. Pick one from the catalogue and enter its credentials so later steps can reuse it.
    automations: Automate record actions and background jobs. Each automation runs a trigger, action and query flow that you can build out in the full automation builder.
    agents: Add the AI agents that act within this project. Name each one here, then configure its behaviour, model and access in the agent builder.
    chatbots: Add the conversational chatbots for this project. Name each one here, then design its scenarios, styling and channels in the chatbot builder.
    pages: Design the record detail and standalone pages people see. Drag and drop pages to arrange the page tree, then lay out each page's blocks in the page builder.
    roles: Define the access roles for this project and the people in each. You grant every role its resource permissions in the next step.
    permissions: Grant each role access to the project's resources. Pick a capability, then toggle it per role.
    users: Add people to the project and assign them roles. A user's effective access is the sum of the roles they hold.
  # Revision completeness bar — tab row, right-aligned beside the publish
  # cluster, always visible (see components/wizard/RevisionCompletenessBar.vue).
  # Completed ÷ assigned across all six work-item types (five categories plus
  # backlog items) for the open revision.
  # Foot of the Manage & Monitor rail (components/wizard/RevisionCompletenessBar
  # .vue) — that tab only, since it measures work items. The empty case still
  # draws the track at zero and leans on emptyTooltip for the explanation.
  completeness:
    title: Revision progress
    label: '{percent}% complete'
    tooltip: '{completed} of {total} work items assigned to this revision are completed.'
    empty: Nothing assigned
    emptyTooltip: No work items are assigned to this revision yet. Assign items to it from any
      item's editor, or create them on this tab's board, and this bar tracks how many are
      completed.
governance:
  status:
    draft: Draft
    submitted: Submitted
    approved: Approved
    changesRequested: Changes requested
  banner:
    changesRequestedLabel: 'Changes requested:'
steps:
  summary:
    label: Project Summary
  resource-management:
    label: Resource Management
  data-model:
    label: Data Model
  connections:
    label: Connections
  automations:
    label: Automations
  agents:
    label: Agents
  chatbots:
    label: Chatbots
  pages:
    label: Pages
  roles:
    label: Roles
  permissions:
    label: Permissions
  users:
    label: Users
  data-sensitivity:
    label: Data Sensitivity
# The project-level publish approval workflow, built around the single
# well-known 'publish' governance step key: every publish — the first release
# and every later revision — needs a fresh submit -> approve cycle before the
# Publish action even appears (it stays hidden, not just disabled, until
# approved). This is unconditional for every project, and separate from the
# direct per-step Approve/Request changes review on Build/Govern steps (see
# project.wizard.approve / project.wizard.requestChanges above) — approving
# the project itself is rejected while any step is still flagged
# changes-requested. Rendered as the single state-driven button + status Tag
# in the wizard's topbar toolbar (next to the Members button) — there is no
# dedicated "reject this publish" action any more; requesting changes on any
# individual Build/Govern step automatically sends a submitted or approved
# publish back to changes-requested instead (see the backend's
# sendPublishBack side effect).
publish:
  hint:
    draft:
      requester: >-
        This project is ready to be submitted for approval whenever you are — publishing stays
        locked until a reviewer approves it.
      viewer: >-
        Waiting for a project member who can request approval to submit this project for review
        before it can be published.
    changesRequested:
      requester: >-
        Changes were requested on this publish — review the note below, make the adjustments
        needed, then request approval again.
      viewer: >-
        Changes were requested on this publish — waiting for a project member who can request
        approval to address them and resubmit.
    submitted:
      grantor: >-
        This publish is awaiting your review. Approve it to unlock publishing — or, if something
        still needs fixing, request changes on the affected Build or Govern step directly; that
        automatically sends this publish back to changes-requested too.
      viewer: >-
        Submitted for approval — waiting for a project member who can grant approval to review
        it.
    approved: >-
      Approved — this project is ready to publish. Publishing uses up this approval, so the next
      publish will need a fresh one.
  note:
    label: 'Reviewer note:'
  actions:
    requestApproval: Request approval
    resubmit: Resubmit for approval
    approveProject: Approve project
    approveBlockedTooltip: >-
      Approve project is disabled while a Build or Govern step still has changes requested —
      approve that step first to clear its flag, then this can be approved.
    publish: Publish project
  confirm:
    # Shown in the go-live stage, not a dialog (ruled 2026-07-29), whenever the
    # revision still has unfinished work — the same completed-vs-assigned
    # numbers the Manage & Monitor rail's revision progress bar shows (see
    # composables/revisionCompleteness.js). A warning only: unfinished work
    # never blocks publishing.
    unfinishedWarning: >-
      {open} of the {total} work items assigned to this revision are not completed yet — they
      stay assigned to it after publishing. Unfinished work does not block publishing.
  # --- Publish tab ---------------------------------------------------------
  # The fourth wizard tab: review what changed → decide what happens to
  # existing records → approval → go live. See views/Wizard.intent.md.
  heading: Publish revision {version}
  subheading: >-
    This revision replaces revision {parent} as the live project. Check what changes, decide what
    happens to existing data, then send it for approval.
  subheadingFirst: >-
    This is the first time the project goes live. There is no previous revision to replace and no
    existing data to bring across.
  subheadingLive: >-
    This revision is live. Everything below is a record of what went out; to change the project
    again, start a new revision.
  loadFailed: Could not work out what this revision changes. Please try again.
  stages:
    reviewed: Reviewed
    needsDecision: Needs a decision
    decided: Decided
    notStarted: Not started
    awaiting: Awaiting approval
    changes:
      title: What changes
      hint: '{count} changes · {risky} need care'
      hintNone: Nothing has changed since the previous revision
    migration:
      title: Bring the data across
      hintFirst: No previous revision, so there is nothing to bring across
      hintBlocked: '{count} still need your decision before anything can go live'
      hintClear: Every field is accounted for
    approval:
      title: Get it approved
      hint: A reviewer signs off before anything goes live
      hintApproved: Approved and ready to publish
    goLive:
      title: Go live
      hint: What happens the moment you publish
  changes:
    none: This revision changes nothing that affects the live project.
    # Field changes borrow their module's colour; "field" is not a resource kind.
    field: Field
    inventoryHeading: What this revision contains
    op:
      added: Added
      removed: Removed
      changed: Changed
    risk:
      safe: Safe
      # Destructive, but the record count behind it could not be read.
      dangerous: Data will be lost
      records: '{count} records affected'
  migration:
    intro: >-
      Records live in the current revision. Anything not mapped across is left behind when that
      revision is retired. Fields that line up are handled for you — only the ones below need you.
    allAccountedFor: Every record has somewhere to land.
    nothingToMigrate: There is no previous revision, so there are no records to bring across.
    moduleRecords: '{count} records'
    fieldGone: ' — this field no longer exists'
    moduleGone: ' — this module no longer exists'
    moveInto: Move the data into…
    discard: Discard the data
    change: Change
    newField: new field
    outcome:
