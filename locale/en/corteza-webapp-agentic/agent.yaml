  name:
    label: Name
    help: A short, human-readable name for this agent
  handle:
    label: Handle
    help: Unique identifier used for programmatic access
  description:
    label: Description
    help: Explain what this agent does — visible to users who interact with it
  status:
    label: Status
    help: Only active agents can be invoked
  systemPrompt:
    label: System Prompt
    help: Instructions that define the agent's personality, capabilities, and constraints. This is sent to the LLM at the start of every conversation
    required: System prompt is required
  guardrails:
    label: Guardrails
    help: Rules the agent must follow (e.g. "Stay on topic").
    add: Add guardrail
    placeholder: e.g. Stay on topic
  tcl:
    label: Treaty Compliance Layer
    help: Enforce compliance with applicable treaties and regulations at the platform level
    enabledLabel: Enable TCL
    enabledHelp: When enabled, the agent will enforce compliance rules and inject treaty articles into the system prompt
    temperature:
      label: Citation Verbosity
      help: Controls how verbosely the agent cites compliance references in responses (1 = minimal, 10 = full citations)
    articles:
      label: Compliance Articles
      help: Select which treaty articles the agent must comply with.
      placeholder: Select articles...
      hardwired: Required
  injectSystemContext:
    label: System Context
    help: Inject platform context into the system prompt, giving the agent knowledge about the data model and capabilities
  knowledgeBases:
    label: Topics
    help: Attach topics to give the agent domain-specific context and data schema awareness
    placeholder: Select topics...
    createNew: Create new
    dialogCreate: Create Topic
    dialogEdit: Edit Topic
    handle: Handle
    title: Title
    description: Description
    descriptionHelp: Free-text knowledge — policies, domain context, instructions, or any information the agent should know
    composeContext: Compose Context
    namespacePlaceholder: Select namespace...
    modulesPlaceholder: Select modules...
    addNamespace: Add namespace
  provider:
    label: LLM Provider
    help: The LLM provider to use for this agent
  model:
    label: Model
    help: The specific model to use from the selected provider
  temperature:
    label: Temperature
    help: Controls randomness. Lower values (0.0) are more deterministic, higher values (1.0) are more creative

  limits:
    label: Limits
  maxIterations:
    label: Max Iterations
    help: Maximum number of think-act cycles before the agent stops. Each iteration may include an LLM call and tool executions
  contextWindow:
    label: Token Limit
    help: Maximum number of tokens allowed in the conversation. When the limit is exceeded, the agent will stop executing
  outputTokens:
    label: Agent Response Limit
    help: Maximum number of tokens the agent can generate per single response
  timeout:
    label: Timeout
    help: Maximum duration for the entire agent execution (e.g. "30s", "2m")
  contextNamespace:
    label: Context Namespace
    help: The Corteza namespace this agent operates within
  contextModule:
    label: Context Module
    help: The Corteza module this agent has context about
  tools:
    label: Allowed Tools
    help: Select which MCP tools this agent is allowed to use
    noTools: No tools configured
    selectPlaceholder: Select a tool to add...
    hintPlaceholder: Optional hints for this tool...
    toolName: Tool Name
    toolDescription: Description
    toolHints: Hints
  taqs:
    label: Allowed TAQs
    help: Select TAQs this agent can invoke to automate routines
    selectPlaceholder: Select a TAQ to add...
    hintPlaceholder: Optional hints for this TAQ...
  workflows:
    label: Allowed Workflows
    help: Select Corteza workflows this agent can trigger
    selectPlaceholder: Select a workflow to add...
    hintPlaceholder: Optional hints for this workflow...
  userEnabled:
    label: Enable User Chat Invocation
    help: Allow users to invoke this agent directly through chat
  sidebarRoles:
    label: Agent Sidebar Roles
    help: Select roles that will see this agent in their App Sidebar.
  systemEnabled:
    label: Enable System Invocation
    help: Allow this agent to be invoked programmatically by the system (e.g. workflows, automation)
  serviceAccount:
    label: Service Account
    help: The user account this agent impersonates when running system invocations
  inputSchema:
    label: Input Schema (JSON)
  outputFormat:
    label: Output Format
    help: Expected output format for system invocations (e.g. JSON schema)
