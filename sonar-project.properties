sonar.projectKey=CChengjie_corteza_fde
sonar.organization=cchengjie

sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Keep executable test harnesses out of production coverage while preserving
# Sonar analysis for the application and library sources.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.spec.js,**/jest.c311.config.js,tools/c311-browser/test_*.py
# Test files are classified separately from source files so they do not count
# as uncovered production code while remaining available to the analyzer.
sonar.exclusions=**/*.test.ts,**/*.spec.js,**/jest.c311.config.js,tools/c311-browser/test_*.py
sonar.coverage.exclusions=tools/c311-browser/fe01_matrix.py
sonar.javascript.lcov.reportPaths=.sonar/coverage/lib-js.info,.sonar/coverage/lib-vue.info,.sonar/coverage/c311.info
