# List of loggable service actions

resource: automation:trigger
service: trigger

import:
  - github.com/crusttech/human/server/automation/types

# Default sensitivity for actions
defaultActionSeverity: notice

# default severity for errors
defaultErrorSeverity: error


props:
  - name: trigger
    type: "*types.Trigger"
    fields: [ ID ]
  - name: new
    type: "*types.Trigger"
    fields: [ ID ]
  - name: update
    type: "*types.Trigger"
    fields: [ ID ]
  - name: filter
    type: "*types.TriggerFilter"


actions:
  - action: search
    log: "searched for matching triggers"
    severity: info

  - action: lookup
    log: "looked-up for a {{trigger}}"
    severity: info

  - action: create
    log: "created {{trigger}}"

  - action: update
    log: "updated {{trigger}}"

  - action: delete
    log: "deleted {{trigger}}"

  - action: undelete
    log: "undeleted {{trigger}}"

  - action: searchOnManual
    log: "searched for manual trigger"
    severity: info

errors:
  - error: notFound
    message: "trigger not found"

  - error: invalidID
    message: "invalid ID"

  - error: staleData
    message: "trigger was modified by someone else or by a workflow after you've opened it. Please refresh to see the latest updated version"
    severity: warning

  - error: invalidInterval
    message: "invalid interval; use five cron fields: minute, hour, day of month, month and day of week (e.g. 0 6 * * *)"

  - error: valueRequired
    message: "an enabled interval or timestamp trigger needs a value"

  - error: invalidTimestamp
    message: "invalid timestamp; use an RFC 3339 date and time (e.g. 2026-10-01T06:00:00Z)"

  - error: invalidConstraint
    message: "invalid trigger constraint; the operator is not supported or its pattern does not compile"

  - error: notAllowedToRead
    message: "not allowed to read this trigger"
    log: "failed to read {{trigger.ID}}; insufficient permissions"

  - error: notAllowedToSearch
    message: "not allowed to search or list triggers"
    log: "failed to search or list trigger; insufficient permissions"

  - error: notAllowedToCreate
    message: "not allowed to create triggers"
    log: "failed to create trigger; insufficient permissions"

  - error: notAllowedToUpdate
    message: "not allowed to update this trigger"
    log: "failed to update {{trigger.ID}}; insufficient permissions"

  - error: notAllowedToDelete
    message: "not allowed to delete this trigger"
    log: "failed to delete {{trigger.ID}}; insufficient permissions"

  - error: notAllowedToUndelete
    message: "not allowed to undelete this trigger"
    log: "failed to undelete {{trigger.ID}}; insufficient permissions"
