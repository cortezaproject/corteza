# List of loggable service actions

resource: automation:trigger-definition
service: triggerDefinition

import:
  - github.com/cortezaproject/corteza/server/automation/types

# Default sensitivity for actions
defaultActionSeverity: notice

# default severity for errors
defaultErrorSeverity: error


props:
  - name: triggerDefinition
    type: "*types.TriggerDefinition"
    fields: [ handle, ID ]
  - name: new
    type: "*types.TriggerDefinition"
    fields: [ handle, ID ]
  - name: update
    type: "*types.TriggerDefinition"
    fields: [ handle, ID ]
  - name: filter
    type: "*types.TriggerDefinitionFilter"


actions:
  - action: search
    log: "searched for matching trigger definitions"
    severity: info

  - action: lookup
    log: "looked-up for a {{triggerDefinition}}"
    severity: info

  - action: create
    log: "created {{triggerDefinition}}"

  - action: update
    log: "updated {{triggerDefinition}}"

  - action: delete
    log: "deleted {{triggerDefinition}}"

  - action: undelete
    log: "undeleted {{triggerDefinition}}"

errors:
  - error: notFound
    message: "trigger definition not found"

  - error: invalidID
    message: "invalid ID"

  - error: invalidHandle
    message: "invalid handle"

  - error: staleData
    message: "stale data"
    severity: warning

  - error: handleNotUnique
    message: "trigger definition handle not unique"
    log: "duplicate handle used for trigger definition ({{triggerDefinition}})"

  - error: notAllowedToRead
    message: "not allowed to read this trigger definition"
    log: "failed to read {{triggerDefinition.handle}}; insufficient permissions"

  - error: notAllowedToSearch
    message: "not allowed to search or list trigger definitions"
    log: "failed to search or list trigger definitions; insufficient permissions"

  - error: notAllowedToCreate
    message: "not allowed to create trigger definitions"
    log: "failed to create trigger definition; insufficient permissions"

  - error: notAllowedToUpdate
    message: "not allowed to update this trigger definition"
    log: "failed to update {{triggerDefinition}}; insufficient permissions"

  - error: notAllowedToDelete
    message: "not allowed to delete this trigger definition"
    log: "failed to delete {{triggerDefinition}}; insufficient permissions"

  - error: notAllowedToUndelete
    message: "not allowed to undelete this trigger definition"
    log: "failed to undelete {{triggerDefinition}}; insufficient permissions"
