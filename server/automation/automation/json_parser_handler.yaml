functions:
  parse:
    meta:
      short: JSON Parse string into a JSON object
      description: Takes a JSON string and returns the parsed JSON value. The result can be an object or array depending on the input.
    labels:
      json: "step"
      parser: "step"
    params:
      jsonText:
        required: true
        types: [{wf: String}]
    results:
      result: {wf: Any}
      error: {wf: String}

  stringify:
    meta:
      short: JSON Convert a object to a string
      description: >
        Takes a JSON object (Any type) and returns a JSON string representation.
        Also converts JavaScript-style backtick strings to proper JSON.
    labels:
      json: "step"
      stringify: "step"
    params:
      jsonObject:
        required: true
        types: [{wf: Any}]
        description: The JSON object to stringify (can be string, object, array, number, bool)
    results:
      result: {wf: String}
      error: {wf: String}

  template:
    meta:
      short: JSON Template with variable substitution
      description: >
        Takes a JSON template string with ${var.key} placeholders and a vars map.
        Substitutes the placeholders with values from vars and returns the final JSON string.
        Supports dot-notation for nested values (e.g., ${var.filename}, ${var.data.content}).
    labels:
      json: "step"
      template: "step"
    params:
      template:
        required: true
        types: [{wf: String}]
        description: The JSON template string with ${var.key} placeholders
      vars:
        required: false
        types: [{wf: Vars}]
        description: Variables for substitution (optional)
    results:
      result: {wf: String}
      error: {wf: String}