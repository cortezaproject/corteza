name: apigwBody

imports:
  - github.com/cortezaproject/corteza/server/pkg/http
  - io

functions:
  read:
    meta:
      short: Read request body from integration gateway
    params:
      request:
        meta: { label: Request }
        required: true
        types:
          - { wf: HttpRequest, go: '*http.Request' }
    results:
      body:
        wf: String
  readFile:
    meta:
      short: Read file from integration gateway
    params:
      request:
        meta: { label: Request }
        required: true
        types:
          - { wf: HttpRequest, go: '*http.Request' }
      name:
        meta: { label: Name }
        required: true
        types:
          - { wf: String }
    results:
      file:
        wf: Reader
      fileName:
        wf: String
      exists:
        wf: Boolean
