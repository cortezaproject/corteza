name: loop

imports:
  - io

functions:
  sequence:
    kind: iterator
    meta:
      short: Iterates over sequence of numbers
    params:
      first: { meta: { label: First }, types: [ { wf: Integer } ] }
      last:  { meta: { label: Last }, types: [ { wf: Integer } ] }
      step:  { meta: { label: Step }, types: [ { wf: Integer } ] }
    results:
      counter:
        wf: Integer
      isFirst:
        wf: Boolean
      isLast:
        wf: Boolean

  do:
    kind: iterator
    meta:
      short: Condition
      description: Iterates while condition is true
    params:
      while:
        required: true
        types: [ { wf: String } ]
        meta:
          label: While expression
          description: Expression to be evaluated each iteration; loop will continue until expression is true

  each:
    kind: iterator
    meta:
      short: Items
      description: Iterates over set of items
    params:
      items:
        meta: { label: Items }
        required: true
        types: [ { wf: Array } ]
    results:
      item:
        wf: Any
        go: 'interface{}'

  lines:
    kind: iterator
    meta:
      short: Stream lines
      description: Iterates over lines from stream
    params:
      stream:
        meta: { label: Stream }
        required: true
        types: [ { wf: Reader, go: "io.Reader" } ]
    results:
      line:
        wf: String
        go: string
