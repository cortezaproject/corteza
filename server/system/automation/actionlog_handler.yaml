imports:
  - time
  - github.com/cortezaproject/corteza/server/pkg/actionlog

snippets:
  filterParams: &filterParams
    fromTimestamp:     { meta: { label: From timestamp }, types: [ { wf: DateTime } ] }
    toTimestamp:       { meta: { label: To timestamp }, types: [ { wf: DateTime } ] }
    beforeActionID:    { meta: { label: Before action ID }, types: [ { wf: ID } ] }
    actorID:           { meta: { label: Actor ID }, types: [ { wf: ID } ] }
    origin:            { meta: { label: Origin }, types: [ { wf: String } ] }
    resource:          { meta: { label: Resource }, types: [ { wf: String } ] }
    action:            { meta: { label: Action }, types: [ { wf: String } ] }
    limit:             { meta: { label: Limit }, types: [ { wf: UnsignedInteger } ] }

  rvAction: &rvAction
    wf: Action

labels: &labels
  actionlog:  "step,workflow"

functions:
  search:
    meta:
      short: Action log search
    params: *filterParams
    labels:
      <<: *labels
    results:
      actions:
        <<: *rvAction
        isArray: true

  each:
    kind: iterator
    meta:
      short: Action log
    params: *filterParams
    labels:
      <<: *labels
    results:
      action: *rvAction

  record:
    meta:
      short: Record action into action log
    labels:
      <<: *labels
    params:
      action:
        meta: { label: Action }
        types: [ { wf: String } ]
      resource:
        meta: { label: Resource }
        types: [ { wf: String } ]
      error:
        meta: { label: Error }
        types: [ { wf: String } ]
      severity:
        types: [ { wf: String } ]
        meta:
          label: Severity
          visual:
            options:
              - "emergency"
              - "alert"
              - "critical"
              - "err"
              - "warning"
              - "notice"
              - "info"
              - "debug"
      description:
        meta: { label: Description }
        types: [ { wf: String } ]
      meta:
        meta: { label: Meta }
        types: [ { wf: Vars, go: '*expr.Vars' } ]
