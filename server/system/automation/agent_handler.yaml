imports:
  - github.com/crusttech/human/server/system/types

name: agent

functions:
  run:
    meta:
      short: Invoke agent
      description: Executes an agent with the given input and returns its response
    labels:
      agent: "step,workflow"
    params:
      agentID:
        meta: { label: Agent, visual: { input: { type: agent } } }
        required: true
        types:
          - { wf: ID }
      input:
        meta: { label: Input }
        required: true
        types:
          - { wf: String }
      conversationID:
        meta: { label: Conversation ID }
        types:
          - { wf: ID }
    results:
      output:
        wf: String
      conversationID:
        wf: ID

  lookup:
    meta:
      short: Agent lookup
      description: Find a specific agent by ID or handle; a handle shared by several agents resolves to the first
    labels:
      agent: "step,workflow"
    params:
      lookup:
        meta: { label: Lookup }
        required: true
        types:
          - { wf: ID }
          - { wf: Handle }
          - { wf: Agent, suffix: res }
    results:
      agent:
        wf: Agent
