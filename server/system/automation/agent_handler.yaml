name: agent

functions:
  run:
    meta:
      short: Invoke agent
      description: Executes an agent with the given input and returns its response
    labels:
      agent: "step,workflow"
    params:
      agentID:
        meta: { label: Agent ID }
        required: true
        types:
          - { wf: ID }
      input:
        meta: { label: Input }
        required: true
        types:
          - { wf: String }
      conversationID:
        meta: { label: Conversation ID }
        types:
          - { wf: ID }
    results:
      output:
        wf: String
      conversationID:
        wf: ID
