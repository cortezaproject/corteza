  - title: Project Groups
    path: '/projects/{projectID}/groups'
    entrypoint: projectGroup
    genController: true
    compound: false
    authentication:
      - Client ID
      - Session ID
    imports:
      - time
    apis:
      - name: list
        method: GET
        title: List project groups
        path: '/'
        parameters:
          path:
            - type: uint64
              name: projectID
              required: true
              title: Project ID
          get:
            - { type: string, name: query, title: Search query }
            - { type: string, name: handle, title: Handle filter }
            - { type: '[]string', name: projectGroupID, title: Filter by group IDs }
            - { type: uint, name: deleted, title: 'Deleted filter (0=exclude 1=only 2=include)' }
            - { type: uint, name: limit, title: Limit }
            - { type: bool, name: incTotal, title: Include total count }
            - { type: string, name: pageCursor, title: Page cursor }
            - { type: string, name: sort, title: Sort }

      - name: create
        method: POST
        # name/description map onto res.Meta (Short/Description), not plain
        # struct fields, so they are genHook:true and filled by the companion
        # beforeCreate. projectID is a scope id the endpoint drops under
        # compound:false; beforeCreate also assigns it onto res from r.
        title: Create project group
        path: '/'
        parameters:
          path:
            - { type: uint64, name: projectID, required: true, title: Project ID }
          post:
            - { type: string, name: handle, required: true, title: Handle }
            - { type: string, name: name, title: Name, genHook: true }
            - { type: string, name: description, title: Description, genHook: true }

      - name: read
        method: GET
        title: Read project group
        path: '/{projectGroupID}'
        parameters:
          path:
            - { type: uint64, name: projectID, required: true, title: Project ID }
            - { type: uint64, name: projectGroupID, required: true, title: Project Group ID }

      - name: update
        method: PUT
        # name/description map onto res.Meta (Short/Description) rather than
        # plain struct fields, so they are genHook:true and filled by the
        # companion beforeUpdate. Handle is a plain field assigned directly.
        title: Update project group
        path: '/{projectGroupID}'
        parameters:
          path:
            - { type: uint64, name: projectID, required: true, title: Project ID }
            - { type: uint64, name: projectGroupID, required: true, title: Project Group ID }
          post:
            - { type: string, name: handle, title: Handle }
            - { type: string, name: name, title: Name, genHook: true }
            - { type: string, name: description, title: Description, genHook: true }
            - { type: '*time.Time', name: updatedAt, title: Last update timestamp }

      - name: delete
        method: DELETE
        title: Delete project group
        path: '/{projectGroupID}'
        parameters:
          path:
            - { type: uint64, name: projectID, required: true, title: Project ID }
            - { type: uint64, name: projectGroupID, required: true, title: Project Group ID }

      - name: entryAdd
        method: POST
        title: Add resource to group
        path: '/{projectGroupID}/entries/{resourceRef}'
        parameters:
          path:
            - { type: uint64, name: projectID, required: true, title: Project ID }
            - { type: uint64, name: projectGroupID, required: true, title: Project Group ID }
            - {
                type: string,
                name: resourceRef,
                required: true,
                title: Resource ref (corteza::component:type/ID),
              }

      - name: entryRemove
        method: DELETE
        title: Remove resource from group
        path: '/{projectGroupID}/entries/{resourceRef}'
        parameters:
          path:
            - { type: uint64, name: projectID, required: true, title: Project ID }
            - { type: uint64, name: projectGroupID, required: true, title: Project Group ID }
            - {
                type: string,
                name: resourceRef,
                required: true,
                title: Resource ref (corteza::component:type/ID),
              }

