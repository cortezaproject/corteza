---
# This is direct conversion from old api/*/spec.json files
# using https://www.json2yaml.com/
#
# Next step: swagger.

endpoints:
  - title: Authentication
    path: '/auth'
    entrypoint: auth
    authentication: []
    apis:
      - name: impersonate
        method: POST
        title: Impersonate a user
        path: '/impersonate'
        parameters:
          post:
            - name: userID
              type: uint64
              required: true
              title: ID of the impersonated user
  - title: Authentication clients
    path: '/auth/clients'
    entrypoint: authClient
    authentication: []
    genController: true
    imports:
      - github.com/crusttech/human/server/pkg/label
      - github.com/crusttech/human/server/system/types
      - time
      - labelTypes github.com/crusttech/human/server/pkg/label/types
    apis:
      - name: list
        method: GET
        title: List clients
        path: '/'
        parameters:
          get:
            - name: handle
              required: false
              title: Client handle
              type: string
            - name: deleted
              required: false
              title: Exclude (0, default), include (1) or return only (2) deleted clients
              type: uint
            - type: map[string]labelTypes.LabelValue
              name: labels
              title: Labels
              parser: label.ParseStrings
            - type: uint
              name: limit
              title: Limit
            - type: bool
              name: incTotal
              title: Include total counter
            - type: string
              name: pageCursor
              title: Page cursor
            - type: string
              name: sort
              title: Sort items
      - name: create
        method: POST
        title: Create client
        path: '/'
        parameters:
          post:
            - { name: handle, type: string, title: Client handle }
            - {
                name: meta,
                type: '*types.AuthClientMeta',
                title: Additional info,
                parser: 'types.ParseAuthClientMeta',
              }
            - {
                name: validGrant,
                type: string,
                title: Valid grants (authorization_code,
                client_credentials),
              }
            - { name: redirectURI, type: string, title: Space delimited list of redirect URIs }
            - { name: scope, type: string, title: Space delimited list of scopes }
            - { name: trusted, type: bool, title: Is client trusted (skip authorization) }
            - { name: enabled, type: bool, title: Is client enabled }
            - {
                name: validFrom,
                type: '*time.Time',
                title: Date and time from when client becomes valid,
              }
            - {
                name: expiresAt,
                type: '*time.Time',
                title: Date and time from client is no logner valid,
              }
            - {
                name: security,
                type: '*types.AuthClientSecurity',
                title: Security settings,
                allowed,
                denied,
                forced roles,
                parser: 'types.ParseAuthClientSecurity',
              }
            - {
                name: labels,
                type: 'map[string]labelTypes.LabelValue',
                title: Labels,
                parser: label.ParseStrings,
              }
      - name: update
        method: PUT
        title: Update user details
        path: '/{clientID}'
        parameters:
          path:
            - type: uint64
              name: clientID
              required: true
              title: Client ID
          post:
            - { name: handle, type: string, title: Client handle }
            - {
                name: meta,
                type: '*types.AuthClientMeta',
                title: Additional info,
                parser: 'types.ParseAuthClientMeta',
              }
            - {
                name: validGrant,
                type: string,
                title: Valid grants (authorization_code,
                client_credentials),
              }
            - { name: redirectURI, type: string, title: Space delimited list of redirect URIs }
            - { name: scope, type: string, title: Space delimited list of scopes }
            - { name: trusted, type: bool, title: Is client trusted (skip authorization) }
            - { name: enabled, type: bool, title: Is client enabled }
            - {
                name: validFrom,
                type: '*time.Time',
                title: Date and time from when client becomes valid,
              }
            - {
                name: expiresAt,
                type: '*time.Time',
                title: Date and time from client is no logner valid,
              }
            - {
                name: security,
                type: '*types.AuthClientSecurity',
                title: Security settings,
                allowed,
                denied,
                forced roles,
                parser: 'types.ParseAuthClientSecurity',
              }
            - {
                name: labels,
                type: 'map[string]labelTypes.LabelValue',
                title: Labels,
                parser: label.ParseStrings,
              }
            - {
                type: '*time.Time',
                name: updatedAt,
                required: false,
                title: Last update (or creation) date,
              }
      - name: read
        method: GET
        title: Read client details
        path: '/{clientID}'
        parameters:
          path:
            - type: uint64
              name: clientID
              required: true
              title: Client ID
      - name: delete
        method: DELETE
        title: Remove client
        path: '/{clientID}'
        parameters:
          path:
            - type: uint64
              name: clientID
              required: true
              title: Client ID
      - name: undelete
        method: POST
        title: Undelete client
        path: '/{clientID}/undelete'
        parameters:
          path:
            - type: uint64
              name: clientID
              required: true
              title: Client ID
      - name: regenerateSecret
        method: POST
        title: Regenerate client's secret
        path: '/{clientID}/secret'
        parameters:
          path:
            - type: uint64
              name: clientID
              required: true
              title: Client ID
      - name: exposeSecret
        method: GET
        title: Exposes client's secret
        path: '/{clientID}/secret'
        parameters:
          path:
            - type: uint64
              name: clientID
              required: true
              title: Client ID

  - title: Expressions
    path: '/expressions'
    entrypoint: expression
    endpoint: expressions
    authentication: []
    imports:
      - github.com/crusttech/human/server/pkg/label
      - labelTypes github.com/crusttech/human/server/pkg/label/types
    apis:
      - name: evaluate
        method: POST
        title: Evaluate expressions
        path: '/evaluate'
        parameters:
          post:
            - name: variables
              type: map[string]interface{}
              parser: parseMapStringInterface
              title: variables
            - name: expressions
              type: map[string]labelTypes.LabelValue
              parser: label.ParseStrings
              title: expressions

  - title: Settings
    path: '/settings'
    entrypoint: settings
    authentication: []
    imports:
      - github.com/crusttech/human/server/system/types
    apis:
      - name: list
        method: GET
        title: List settings
        path: '/'
        parameters:
          get:
            - name: prefix
              type: string
              title: Key prefix
      - name: update
        method: PATCH
        title: Update settings
        path: '/'
        parameters:
          post:
            - name: values
              type: types.SettingValueSet
              title: 'Array of new settings: `[{ name: ..., value: ... }]`. Omit value to
                remove setting'
              required: true
      - name: get
        method: GET
        title: Get a value for a key
        path: '/{key}'
        parameters:
          path:
            - name: key
              type: string
              title: Setting key
              required: true
          get:
            - name: ownerID
              type: uint64
              title: Owner ID
      - name: set
        path: '/{key}'
        method: POST
        title: Set value for specific setting
        parameters:
          path:
            - name: key
              type: string
              title: Key
              required: true
          post:
            - name: upload
              type: '*multipart.FileHeader'
              title: File to upload
            - name: ownerID
              type: uint64
              title: Owner ID
      - name: current
        method: GET
        title: Current compose settings
        path: '/current'
  - title: Roles
    description: An organisation may have many roles. Roles may have many channels available.
      Access to channels may be shared between roles.
    path: '/roles'
    entrypoint: role
    genController: true
    authentication:
      - Client ID
      - Session ID
    imports:
      - github.com/crusttech/human/server/pkg/label
      - github.com/crusttech/human/server/system/types
      - time
      - labelTypes github.com/crusttech/human/server/pkg/label/types
    apis:
      - name: list
        method: GET
        title: List roles
        path: '/'
        parameters:
          get:
            - { type: 'string', name: 'query', title: 'Search query' }
            - { type: 'uint64', name: 'memberID', title: 'Search roles for member' }
            - { type: 'uint64', name: 'userGroupID', title: 'Search roles for user group' }
            - { type: '[]string', name: 'roleID', title: 'Search roles by ID' }
            - {
                type: 'uint',
                name: 'deleted',
                title: 'Exclude (0, default), include (1) or return only (2) deleted roles',
              }
            - {
                type: 'uint',
                name: 'archived',
                title: 'Exclude (0, default), include (1) or return only (2) archived roles',
              }
            - {
                type: 'map[string]labelTypes.LabelValue',
                name: 'labels',
                title: 'Labels',
                parser: 'label.ParseStrings',
              }
            - { type: 'uint', name: 'limit', title: 'Limit' }
            - { name: 'incTotal', type: 'bool', title: 'Include total counter' }
            - { type: 'string', name: 'pageCursor', title: 'Page cursor' }
            - { type: 'string', name: 'sort', title: 'Sort items' }
      - name: create
        method: POST
        title: Update role details
        path: '/'
        genSkip: true
        parameters:
          post:
            - { type: 'string', name: 'name', required: true, title: 'Name of role' }
            - { type: 'string', name: 'handle', title: 'Handle for role' }
            - { type: '[]string', name: 'members', title: 'role member IDs' }
            - {
                type: '*types.RoleMeta',
                name: 'meta',
                title: 'Meta',
                parser: 'types.ParseRoleMeta',
              }
            - {
                type: 'map[string]labelTypes.LabelValue',
                name: 'labels',
                title: 'Labels',
                parser: 'label.ParseStrings',
              }
      - name: update
        method: PUT
        title: Update role details
        path: '/{roleID}'
        genSkip: true
        parameters:
          path:
            - { type: 'uint64', name: 'roleID', required: true, title: Role ID }
          post:
            - { type: 'string', name: 'name', required: false, title: 'Name of role' }
            - { type: 'string', name: 'handle', required: false, title: 'Handle for role' }
            - { type: '[]string', name: 'members', required: false, title: 'role member IDs' }
            - {
                type: '*types.RoleMeta',
                name: 'meta',
                title: 'Meta',
                parser: 'types.ParseRoleMeta',
              }
            - {
                type: 'map[string]labelTypes.LabelValue',
                name: 'labels',
                title: 'Labels',
                parser: 'label.ParseStrings',
              }
            - {
                type: '*time.Time',
                name: updatedAt,
                required: false,
                title: Last update (or creation) date,
              }
      - name: read
        method: GET
        title: Read role details and memberships
        path: '/{roleID}'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Role ID
      - name: delete
        method: DELETE
        title: Remove role
        path: '/{roleID}'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Role ID
      - name: archive
        method: POST
        title: Archive role
        path: '/{roleID}/archive'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Role ID
      - name: unarchive
        method: POST
        title: Unarchive role
        path: '/{roleID}/unarchive'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Role ID
      - name: undelete
        method: POST
        title: Undelete role
        path: '/{roleID}/undelete'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Role ID
      - name: move
        method: POST
        title: Move role to different organisation
        path: '/{roleID}/move'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Role ID
          post:
            - type: uint64
              name: organisationID
              required: true
              title: Role ID
      - name: merge
        method: POST
        title: Merge one role into another
        path: '/{roleID}/merge'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Source Role ID
          post:
            - type: uint64
              name: destination
              required: true
              title: Destination Role ID
      - name: memberList
        method: GET
        title: Returns all role members
        path: '/{roleID}/members'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Source Role ID
      - name: memberAddGroup
        method: POST
        title: Add user group to a user group
        path: '/{roleID}/member-g/{userGroupID}'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Source Role ID
            - type: uint64
              name: userGroupID
              required: true
              title: User Group ID
      - name: memberAdd
        method: POST
        title: Add member to a role
        path: '/{roleID}/member/{userID}'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Source Role ID
            - type: uint64
              name: userID
              required: true
              title: User ID
      - name: memberRemove
        method: DELETE
        title: Remove member from a role
        path: '/{roleID}/member/{userID}'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Source Role ID
            - type: uint64
              name: userID
              required: true
              title: User ID
      - name: memberRemoveGroup
        method: DELETE
        title: Remove user group from a role
        path: '/{roleID}/member-g/{userGroupID}'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: Source Role ID
            - type: uint64
              name: userGroupID
              required: true
              title: User Group ID
      - name: triggerScript
        method: POST
        title: Fire system:role trigger
        path: '/{roleID}/trigger'
        parameters:
          path:
            - type: uint64
              name: roleID
              required: true
              title: ID
          post:
            - name: script
              type: string
              title: Script to execute
              required: true
            - name: args
              type: map[string]interface{}
              parser: parseMapStringInterface
              title: Arguments to pass to the script
      - name: cloneRules
        path: '/{roleID}/rules/clone'
        method: POST
        title: Clone permission settings to a role
        parameters:
          path:
            - name: roleID
              type: uint64
              required: true
              title: Role ID
          get:
            - name: cloneToRoleID
              type: '[]string'
              required: true
              title: Clone set of rules to roleID
  - title: User Groups
    description: User groups outline role hierarchy
    path: '/user-groups'
    entrypoint: userGroup
    genController: true
    # members are not a UserGroup struct field: the afterCreate/afterUpdate
    # companion hooks MemberAdd them one-by-one once the resource (and its
    # assigned id) exists -- post-service logic the generator can't inline.
    genAfterCreate: true
    genAfterUpdate: true
    authentication:
      - Client ID
      - Session ID
    imports:
      - github.com/crusttech/human/server/pkg/label
      - github.com/crusttech/human/server/system/types
      - github.com/crusttech/human/server/pkg/id
      - time
      - labelTypes github.com/crusttech/human/server/pkg/label/types
    apis:
      - name: list
        method: GET
        title: List user groups
        path: '/'
        parameters:
          get:
            - { type: 'string', name: 'query', title: 'Search query' }
            - { type: 'uint64', name: 'memberID', title: 'Search roles for member' }
            - {
                type: '[]id.ID',
                name: 'userGroupID',
                title: 'Search roles by ID',
                parser: 'id.ParseIDs',
              }
            - {
                type: 'uint',
                name: 'deleted',
                title: 'Exclude (0, default), include (1) or return only (2) deleted user groups',
              }
            - {
                type: 'uint',
                name: 'archived',
                title: 'Exclude (0, default), include (1) or return only (2) archived user groups',
              }
            - {
                type: 'map[string]labelTypes.LabelValue',
                name: 'labels',
                title: 'Labels',
                parser: 'label.ParseStrings',
              }
            - { type: 'uint', name: 'limit', title: 'Limit' }
            - { name: 'incTotal', type: 'bool', title: 'Include total counter' }
            - { type: 'string', name: 'pageCursor', title: 'Page cursor' }
            - { type: 'string', name: 'sort', title: 'Sort items' }
      - name: create
        method: POST
        title: Update user groups details
        path: '/'
        parameters:
          post:
            - { type: 'string', name: 'handle', title: 'Handle for user group' }
            # members has no UserGroup struct field; the afterCreate hook adds
            # them one-by-one via MemberAdd after the resource (and its id)
            # exists. genHook keeps the generated Create from assigning it.
            - { type: '[]string', name: 'members', title: 'user group member IDs', genHook: true }
            - {
                type: '*types.UserGroupConfig',
                name: 'config',
                title: 'Config',
                parser: 'types.ParseUserGroupConfig',
                genHook: true,
              }
            - {
                type: '*types.UserGroupMeta',
                name: 'meta',
                title: 'Meta',
                parser: 'types.ParseUserGroupMeta',
                genHook: true,
              }
            - {
                type: 'map[string]labelTypes.LabelValue',
                name: 'labels',
                title: 'Labels',
                parser: 'label.ParseStrings',
              }
      - name: update
        method: PUT
        title: Update user group details
        path: '/{userGroupID}'
        parameters:
          path:
            - {
                type: 'id.ID',
                name: 'userGroupID',
                required: true,
                title: User Group ID,
                parser: 'id.ParseID',
              }
          post:
            - { type: 'string', name: 'handle', required: false, title: 'Handle for user group' }
            # members has no UserGroup struct field; the afterUpdate hook adds
            # them one-by-one via MemberAdd. genHook keeps the generated
            # Update from assigning it.
            - {
                type: '[]string',
                name: 'members',
                required: false,
                title: 'user group member IDs',
                genHook: true,
              }
            - {
                type: '*types.UserGroupConfig',
                name: 'config',
                title: 'Config',
                parser: 'types.ParseUserGroupConfig',
                genHook: true,
              }
            - {
                type: '*types.UserGroupMeta',
                name: 'meta',
                title: 'Meta',
                parser: 'types.ParseUserGroupMeta',
                genHook: true,
              }
            - {
                type: 'map[string]labelTypes.LabelValue',
                name: 'labels',
                title: 'Labels',
                parser: 'label.ParseStrings',
              }
            - {
                type: '*time.Time',
                name: updatedAt,
                required: false,
                title: Last update (or creation) date,
              }
      - name: read
        method: GET
        title: Read user group details and memberships
        path: '/{userGroupID}'
        parameters:
          path:
            - type: 'id.ID'
              name: userGroupID
              required: true
              title: User group ID
              parser: 'id.ParseID'
      - name: delete
        method: DELETE
        title: Remove user group
        path: '/{userGroupID}'
        parameters:
          path:
            - type: 'id.ID'
              name: userGroupID
              required: true
              title: User Group ID
              parser: 'id.ParseID'
      - name: undelete
        method: POST
        title: Undelete user group
        path: '/{userGroupID}/undelete'
        parameters:
          path:
            - type: 'id.ID'
              name: userGroupID
              required: true
              title: User group ID
              parser: 'id.ParseID'
      - name: memberList
        method: GET
        title: Returns all user group members
        path: '/{userGroupID}/members'
        parameters:
          path:
            - type: 'id.ID'
              name: userGroupID
              required: true
              title: Source User Group ID
              parser: 'id.ParseID'
      - name: memberAdd
        method: POST
        title: Add member to a user group
        path: '/{userGroupID}/member/{userID}'
        parameters:
          path:
            - type: 'id.ID'
              name: userGroupID
              required: true
              title: Source User Group ID
              parser: 'id.ParseID'
            - type: uint64
              name: userID
              required: true
              title: User ID
  - title: Users
    path: '/users'
    entrypoint: user
    genController: true
    authentication:
      - Client ID
      - Session ID
    imports:
      - github.com/crusttech/human/server/pkg/label
      - github.com/crusttech/human/server/system/types
      - time
      - labelTypes github.com/crusttech/human/server/pkg/label/types
    apis:
      - name: list
        method: GET
        title: Search users (Directory)
        path: '/'
        parameters:
          get:
            - name: userID
              type: '[]string'
              required: false
              title: Filter by user ID
            - name: roleID
              type: '[]string'
              required: false
              title: Filter by role membership
            - type: string
              name: query
              required: false
              title: Search query to match against users
            - type: string
              name: username
              required: false
              title: Search username to match against users
            - type: string
              name: email
              required: false
              title: Search email to match against users
            - type: string
              name: handle
              required: false
              title: Search handle to match against users
            - name: kind
              type: types.UserKind
              required: false
              title: Kind (normal, bot)
            - type: bool
              name: incDeleted
              required: false
              title: "[Deprecated] Include deleted users (requires 'access' permission)"
            - type: bool
              name: incSuspended
              required: false
              title: '[Deprecated] Include suspended users'
            - name: deleted
              required: false
              title: Exclude (0, default), include (1) or return only (2) deleted users
              type: uint
            - name: suspended
              required: false
              title: Exclude (0, default), include (1) or return only (2) suspended users
              type: uint
            - type: map[string]labelTypes.LabelValue
              name: labels
              title: Labels
              parser: label.ParseStrings
            - type: uint
              name: limit
              title: Limit
            - type: bool
              name: incTotal
              title: Include total counter
            - type: string
              name: pageCursor
              title: Page cursor
            - type: string
              name: sort
              title: Sort items
      - name: create
        method: POST
        title: Create user
        path: '/'
        genSkip: true
        parameters:
          post:
            - name: email
              type: string
              required: true
              title: Email
            - name: name
              type: string
              required: false
              title: Name
            - name: handle
              type: string
              required: false
              title: Handle
            - name: 'userGroupID'
              type: 'uint64'
              required: true
              title: 'User group ID the user belongs to'
            - name: kind
              type: types.UserKind
              required: false
              title: Kind (normal, bot)
            - type: map[string]labelTypes.LabelValue
              name: labels
              title: Labels
              parser: label.ParseStrings
            - name: meta
              type: '*types.UserMeta'
              title: Additional user info
              parser: types.ParseUserMeta
      - name: update
        method: PUT
        title: Update user details
        path: '/{userID}'
        genSkip: true
        parameters:
          path:
            - type: uint64
              name: userID
              required: true
              title: User ID
          post:
            - name: email
              type: string
              required: true
              title: Email
            - name: name
              type: string
              title: Name
            - name: handle
              type: string
              required: false
              title: Handle
            - name: 'userGroupID'
              type: 'uint64'
              required: true
              title: 'User group ID the user belongs to'
            - name: kind
              type: types.UserKind
              required: false
              title: Kind (normal, bot)
            - type: map[string]labelTypes.LabelValue
              name: labels
              title: Labels
              parser: label.ParseStrings
            - name: meta
              type: '*types.UserMeta'
              title: Additional user info
              parser: types.ParseUserMeta
            - {
                type: '*time.Time',
                name: updatedAt,
                required: false,
                title: Last update (or creation) date,
              }
      - name: partialUpdate
        method: PATCH
        title: Patch user (experimental)
        path: '/{userID}'
        parameters:
          path:
            - type: uint64
              name: userID
              required: true
              title: User ID
      - name: read
        method: GET
        title: Read user details
        path: '/{userID}'
        parameters:
          path:
            - type: uint64
              name: userID
              required: true
              title: User ID
      - name: delete
