# List of loggable service actions

resource: system:project-ai-system
service: projectAiSystem

defaultActionSeverity: notice

defaultErrorSeverity: error

import:
  - github.com/crusttech/human/server/system/types

props:
  - name: projectAiSystem
    type: "*types.ProjectAiSystem"
    fields: [ handle, ID ]
  - name: new
    type: "*types.ProjectAiSystem"
    fields: [ handle, ID ]
  - name: update
    type: "*types.ProjectAiSystem"
    fields: [ handle, ID ]
  - name: search
    type: "*types.ProjectAiSystemFilter"
    fields: [ ]

actions:
  - action: search
    log: "searched for AI systems"
    severity: info

  - action: lookup
    log: "looked-up for a {{projectAiSystem}}"
    severity: info

  - action: create
    log: "created {{projectAiSystem}}"

  - action: update
    log: "updated {{projectAiSystem}}"

  - action: delete
    log: "deleted {{projectAiSystem}}"

  - action: memberList
    log: "listed resources of {{projectAiSystem}}"
    severity: info

  - action: memberAdd
    log: "added resource to {{projectAiSystem}}"

  - action: memberRemove
    log: "removed resource from {{projectAiSystem}}"

errors:
  - error: notFound
    message: "AI system not found"
    severity: warning

  - error: invalidID
    message: "invalid ID"
    severity: warning

  - error: invalidHandle
    message: "invalid handle"
    severity: warning

  - error: handleNotUnique
    message: "handle not unique"
    severity: warning

  - error: staleData
    message: "AI system was modified by someone else after you've opened it. Please refresh to see the latest updated version"
    severity: warning

  - error: notAllowedToCreate
    message: "not allowed to create an AI system"
    log: "failed to create an AI system; insufficient permissions"

  - error: notAllowedToRead
    message: "not allowed to read this AI system"
    log: "failed to read {{projectAiSystem.handle}}; insufficient permissions"

  - error: notAllowedToSearch
    message: "not allowed to search or list AI systems"
    log: "failed to search or list AI systems; insufficient permissions"

  - error: notAllowedToUpdate
    message: "not allowed to update this AI system"
    log: "failed to update {{projectAiSystem.handle}}; insufficient permissions"

  - error: notAllowedToDelete
    message: "not allowed to delete this AI system"
    log: "failed to delete {{projectAiSystem.handle}}; insufficient permissions"

  - error: notAllowedToManageResources
    message: "not allowed to manage resources of this AI system"
    log: "failed to manage resources of {{projectAiSystem.handle}}; insufficient permissions"
