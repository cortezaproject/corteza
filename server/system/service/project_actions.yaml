# List of loggable service actions

resource: system:project
service: project

defaultActionSeverity: notice

defaultErrorSeverity: error

import:
  - github.com/crusttech/human/server/system/types

props:
  - name: project
    type: "*types.Project"
    fields: [ handle, ID ]
  - name: new
    type: "*types.Project"
    fields: [ handle, ID ]
  - name: update
    type: "*types.Project"
    fields: [ handle, ID ]
  - name: filter
    type: "*types.ProjectFilter"
    fields: [ ]

actions:
  - action: search
    log: "searched for projects"
    severity: info

  - action: lookup
    log: "looked-up for a {{project}}"
    severity: info

  - action: create
    log: "created {{project}}"

  - action: update
    log: "updated {{project}}"

  - action: delete
    log: "deleted {{project}}"

  - action: undelete
    log: "undeleted {{project}}"

  - action: archive
    log: "archived {{project}}"

  - action: unarchive
    log: "unarchived {{project}}"

  # The publish approval cycle. There is no approval history table: these three
  # entries ARE the history, which is why they are logged at the default
  # (notice) severity rather than as info -- "who put this live, and who agreed
  # to it" has to survive in the audit trail.
  - action: requestApproval
    log: "requested publish approval for {{project}}"

  - action: grantApproval
    log: "granted publish approval for {{project}}"

  - action: rejectApproval
    log: "rejected publish approval for {{project}}"

  - action: searchMembers
    log: "searched members of {{project}}"
    severity: info

  - action: addMember
    log: "added member to {{project}}"

  - action: updateMember
    log: "updated member of {{project}}"

  - action: removeMember
    log: "removed member from {{project}}"

errors:
  - error: notFound
    message: "project not found"
    severity: warning

  - error: invalidID
    message: "invalid ID"
    severity: warning

  - error: invalidHandle
    message: "invalid handle"
    severity: warning

  - error: handleNotUnique
    message: "handle not unique"
    severity: warning

  - error: invalidStatus
    message: "invalid project status"
    severity: warning

  - error: staleData
    message: "project was modified by someone else after you've opened it. Please refresh to see the latest updated version"
    severity: warning

  - error: notAllowedToCreate
    message: "not allowed to create a project"
    log: "failed to create a project; insufficient permissions"

  - error: notAllowedToRead
    message: "not allowed to read this project"
    log: "failed to read {{project.handle}}; insufficient permissions"

  - error: notAllowedToSearch
    message: "not allowed to search or list projects"
    log: "failed to search or list projects; insufficient permissions"

  - error: notAllowedToUpdate
    message: "not allowed to update this project"
    log: "failed to update {{project.handle}}; insufficient permissions"

  - error: notAllowedToDelete
    message: "not allowed to delete this project"
    log: "failed to delete {{project.handle}}; insufficient permissions"

  - error: notAllowedToManageMembers
    message: "not allowed to manage members of this project"
    log: "failed to manage members of {{project.handle}}; insufficient permissions"

  - error: notAllowedToRevise
    message: "not allowed to create a revision of this project"
    log: "failed to revise {{project.handle}}; insufficient permissions"

  - error: notAllowedToPublish
    message: "not allowed to publish this project"
    log: "failed to publish {{project.handle}}; insufficient permissions"

  - error: notAllowedToRequestApproval
    message: "not allowed to request publish approval for this project"
    log: "failed to request publish approval for {{project.handle}}; insufficient permissions"

  - error: notAllowedToGrantApproval
    message: "not allowed to decide publish approval for this project"
    log: "failed to decide publish approval for {{project.handle}}; insufficient permissions"

  # Two people minimum for anything going live. Separate from the permission
  # errors above on purpose: the caller IS allowed to decide approvals here,
  # just not this one, and telling them "insufficient permissions" would send
  # them off to ask for a role they already have.
  - error: cannotApproveOwnRequest
    message: "the person who submitted a revision for approval cannot decide it; a second reviewer has to"
    severity: warning

  - error: approvalNotRequested
    message: "this revision has not been submitted for approval"
    severity: warning

  - error: approvalAlreadyRequested
    message: "this revision is already waiting for a decision"
    severity: warning

  - error: notApproved
    message: "this revision has not been approved for publishing"
    severity: warning

  - error: approvalStale
    message: "the revision changed after it was approved; submit it for approval again"
    severity: warning

  - error: invalidRolePreset
    message: "invalid project member role preset"
    severity: warning

  - error: memberNotFound
    message: "project member not found"
    severity: warning

  - error: memberAlreadyExists
    message: "user is already a member of this project"
    severity: warning
