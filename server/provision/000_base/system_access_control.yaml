allow:
  # Near-zero baseline: a plain logged-in user gets nothing by default beyond
  # what login itself needs. Everything else (seeing users, roles, apps, and any
  # compose data) must be granted explicitly through a role — e.g. project roles,
  # which are auto-granted access to their own project's namespace on creation.
  authenticated:
    # Required for the OAuth2/OIDC login flow to authorize the web client.
    corteza::system:auth-client/*:
      - authorize

    # The app menu. Every result is filtered per application by `read`, so on
    # its own this reveals nothing; without it the shell cannot fetch the list
    # it gates section entry on, and would have to fail open.
    corteza::system/:
      - applications.search

      # Pinning an app affects one person's own menu and reaches only apps that
      # person may already see, so it belongs to the baseline. The operation is
      # component-level; a rule written against corteza::system:application/*
      # is never consulted.
      - application.flag.self

  admin:
    corteza::system/:
      - grant
      - action-log.read
      - settings.read
      - settings.manage
      - application.create
      - applications.search
      - auth-client.create
      - auth-clients.search
      - user.create
      - users.search
      - template.create
      - templates.search
      - role.create
      - roles.search
      - reminder.assign
      - notification.assign
      - queue.create
      - queues.search
      - application.flag.global
      - application.flag.self
      - resource-translations.manage
      - apigw-route.create
      - apigw-routes.search
      - report.create
      - reports.search
      - agent.create
      - agents.search
      - ai-conversation.create
      - ai-conversations.search
      - chatbot.create
      - chatbots.search
      - knowledge-base.create
      - knowledge-bases.search
      - llm-provider.create
      - llm-providers.search
      - project-incident.create
      - project-incidents.search
      - project-feature.create
      - project-features.search
      - project-privacy.create
      - project-privacys.search
      - project-task.create
      - project-tasks.search
      - project-review.create
      - project-reviews.search
      - project-backlog-item.create
      - project-backlog-items.search
      # The project itself, and the two compliance kinds that hang off it, were
      # missing here while every work-item kind above was already granted — so
      # an admin could file a task against a project they could neither see nor
      # create. Projects stay admin-only by default: delegating them to a
      # governance role is a per-deployment decision, made by granting these
      # same operations (and the project/* ones below) to that role.
      - project.create
      - projects.search
      - project-ai-system.create
      - project-ai-systems.search
      - project-fria-scenario.create
      - project-fria-scenarios.search

      # User groups, connections and data sources have admin screens but were
      # never granted to anyone, so the screens answered "not allowed" to the
      # role that owns them.
      - user-group.create
      - user-groups.search
      - connection.create
      - connections.search
      - configured-connection.create
      - configured-connections.search
      - dal-connection.create
      - dal-connections.search
      - dal-sensitivity-level.manage
      - dal-schema-alterations.manage
      - labels.search
      - corredor-scripts.search

      # The chatbot inbox reads and advances sessions; without these the
      # section's own list call is refused for the role that owns it.
      - chatbot-session.create
      - chatbot-sessions.search
      - chatbot-session-step.create
      - chatbot-session-steps.search
      - chatbot-session-handoff.create
      - chatbot-session-handoffs.search

    corteza::system:auth-client/*:
      - read
      - update
      - delete
      - authorize

    corteza::system:application/*:
      - read
      - access
      - update
      - delete

    corteza::system:user/*:
      - read
      - update
      - suspend
      - unsuspend
      - delete
      - email.unmask
      - name.unmask

    corteza::system:role/*:
      - read
      - update
      - delete
      - members.manage

    corteza::system:user-group/*:
      - read
      - update
      - delete
      - members.manage

    corteza::system:connection/*:
      - read
      - update
      - delete
      - install

    corteza::system:configured-connection/*:
      - read
      - update
      - delete

    corteza::system:dal-connection/*:
      - read
      - update
      - delete
      - dal-config.manage

    corteza::system:template/*:
      - read
      - update
      - delete
      - render

    corteza::system:queue/*:
      - read
      - update
      - delete
      - queue.read
      - queue.write

    corteza::system:apigw-route/*:
      - read
      - update
      - delete

    corteza::system:report/*:
      - read
      - update
      - delete
      - run

    corteza::system:agent/*:
      - read
      - update
      - delete

    corteza::system:chatbot/*:
      - read
      - update
      - delete
      - sessions.view
      - sessions.manage
      - sessions.handoff.manage

    corteza::system:chatbot-session/*:
      - read
      - update
      - delete

    corteza::system:chatbot-session-step/*:
      - read
      - update
      - delete

    corteza::system:chatbot-session-handoff/*:
      - read
      - update
      - delete

    corteza::system:ai-conversation/*:
      - read
      - update
      - delete

    corteza::system:knowledge-base/*:
      - read
      - update
      - delete

    corteza::system:llm-provider/*:
      - read
      - update
      - delete

    corteza::system:project/*:
      - read
      - update
      - delete
      - members.manage
      # revise/publish are separate from update on purpose: a deployment can
      # grant "may edit the draft" without granting "may put it live".
      - revise
      - publish

    corteza::system:project-ai-system/*:
      - read
      - update
      - delete
      - resources.manage

    corteza::system:project-fria-scenario/*:
      - read
      - update
      - delete

    corteza::system:project-incident/*:
      - read
      - update
      - delete

    corteza::system:project-feature/*:
      - read
      - update
      - delete

    corteza::system:project-privacy/*:
      - read
      - update
      - delete

    corteza::system:project-task/*:
      - read
      - update
      - delete

    corteza::system:project-review/*:
      - read
      - update
      - delete

    corteza::system:project-backlog-item/*:
      - read
      - update
      - delete

  security-admin:
    corteza::system:user-group/*:
      - read
      - update
      - delete
      - members.manage

    corteza::compose/:
      - grant
      - settings.read
      - settings.manage
      - resource-translations.manage

    corteza::automation/:
      - grant
      - resource-translations.manage

    corteza::federation/:
      - grant
      - settings.read
      - settings.manage

    corteza::system/:
      - grant
      - settings.read
      - settings.manage
      - application.create
      - applications.search
      - auth-client.create
      - auth-clients.search
      - user.create
      - users.search
      - template.create
      - templates.search
      - role.create
      - roles.search
      - user-group.create
      - user-groups.search
      - reminder.assign
      - notification.assign
      - application.flag.self
      - resource-translations.manage
      - queue.create
      - queues.search
      - report.create
      - reports.search
      - agent.create
      - agents.search
      - ai-conversation.create
      - ai-conversations.search
      - chatbot.create
      - chatbots.search
      - knowledge-base.create
      - knowledge-bases.search
      - llm-provider.create
      - llm-providers.search
      - project-incident.create
      - project-incidents.search
      - project-feature.create
      - project-features.search
      - project-privacy.create
      - project-privacys.search
      - project-task.create
      - project-tasks.search
      - project-review.create
      - project-reviews.search
      - project-backlog-item.create
      - project-backlog-items.search

    corteza::system:auth-client/*:
      - read
      - update
      - delete
      - authorize

    corteza::system:application/*:
      - read
      - access
      - update
      - delete

    corteza::system:user/*:
      - read
      - update
      - suspend
      - unsuspend
      - delete

    corteza::system:role/*:
      - read
      - update
      - delete
      - members.manage

    corteza::system:report/*:
      - read
      - update
      - delete
      - run

  # Compose rules of its own live in compose_access_control.yaml; opening the
  # webapp that carries them is a system operation, and without it the tile is
  # unreachable for the role the section belongs to.
  low-code-admin:
    corteza::system:application/*:
      - read
      - access

  data-privacy-officer:
    corteza::system:data-privacy-request/*:
      - read
      - approve

    corteza::system/:
      - data-privacy-requests.search

deny:
  # Grants an earlier baseline gave every logged-in user. Provisioning only ever
  # adds rules, so an install that once carried them keeps them for good; an
  # explicit deny is what takes them back. Role holders are unaffected: role
  # kinds resolve in priority order and a common or context role returns on its
  # own allow before the authenticated tier is read (pkg/rbac/ruleset_checks.go).
  # A deployment that genuinely wants one of these for everybody grants it to a
  # role instead.
  authenticated:
    corteza::system/:
      - auth-clients.search
      - users.search
      - roles.search

    corteza::system:user/*:
      - read
      - email.unmask
      - name.unmask

    corteza::system:application/*:
      - read

    corteza::system:role/*:
      - read
