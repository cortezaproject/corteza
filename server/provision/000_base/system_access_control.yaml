allow:
  # Near-zero baseline: a plain logged-in user gets nothing by default beyond
  # what login itself needs. Everything else (seeing users, roles, apps, and any
  # compose data) must be granted explicitly through a role — e.g. project roles,
  # which are auto-granted access to their own project's namespace on creation.
  authenticated:
    # Required for the OAuth2/OIDC login flow to authorize the web client.
    corteza::system:auth-client/*:
      - authorize

  admin:
    corteza::system/:
      - grant
      - action-log.read
      - settings.read
      - settings.manage
      - application.create
      - applications.search
      - auth-client.create
      - auth-clients.search
      - user.create
      - users.search
      - template.create
      - templates.search
      - role.create
      - roles.search
      - reminder.assign
      - queue.create
      - queues.search
      - application.flag.global
      - apigw-route.create
      - apigw-routes.search
      - report.create
      - reports.search
      - agent.create
      - agents.search
      - ai-conversation.create
      - ai-conversations.search
      - chatbot.create
      - chatbots.search
      - knowledge-base.create
      - knowledge-bases.search
      - llm-provider.create
      - llm-providers.search
      - project-incident.create
      - project-incidents.search
      - project-feature.create
      - project-features.search
      - project-privacy.create
      - project-privacys.search
      - project-task.create
      - project-tasks.search
      - project-review.create
      - project-reviews.search
      - project-backlog-item.create
      - project-backlog-items.search
      # The project itself, and the two compliance kinds that hang off it, were
      # missing here while every work-item kind above was already granted — so
      # an admin could file a task against a project they could neither see nor
      # create. Projects stay admin-only by default: delegating them to a
      # governance role is a per-deployment decision, made by granting these
      # same operations (and the project/* ones below) to that role.
      - project.create
      - projects.search
      - project-ai-system.create
      - project-ai-systems.search
      - project-fria-scenario.create
      - project-fria-scenarios.search

    corteza::system:auth-client/*:
      - read
      - update
      - delete
      - authorize

    corteza::system:application/*:
      - read
      - update
      - delete

    corteza::system:user/*:
      - read
      - update
      - suspend
      - unsuspend
      - delete
      - email.unmask
      - name.unmask

    corteza::system:role/*:
      - read
      - update
      - delete
      - members.manage

    corteza::system:template/*:
      - read
      - update
      - delete
      - render

    corteza::system:queue/*:
      - read
      - update
      - delete
      - queue.read
      - queue.write

    corteza::system:apigw-route/*:
      - read
      - update
      - delete

    corteza::system:report/*:
      - read
      - update
      - delete
      - run

    corteza::system:agent/*:
      - read
      - update
      - delete

    corteza::system:chatbot/*:
      - read
      - update
      - delete

    corteza::system:ai-conversation/*:
      - read
      - update
      - delete

    corteza::system:knowledge-base/*:
      - read
      - update
      - delete

    corteza::system:llm-provider/*:
      - read
      - update
      - delete

    corteza::system:project/*:
      - read
      - update
      - delete
      - members.manage
      # revise/publish are separate from update on purpose: a deployment can
      # grant "may edit the draft" without granting "may put it live".
      - revise
      - publish

    corteza::system:project-ai-system/*:
      - read
      - update
      - delete

    corteza::system:project-fria-scenario/*:
      - read
      - update
      - delete

    corteza::system:project-incident/*:
      - read
      - update
      - delete

    corteza::system:project-feature/*:
      - read
      - update
      - delete

    corteza::system:project-privacy/*:
      - read
      - update
      - delete

    corteza::system:project-task/*:
      - read
      - update
      - delete

    corteza::system:project-review/*:
      - read
      - update
      - delete

    corteza::system:project-backlog-item/*:
      - read
      - update
      - delete

  security-admin:
    corteza::compose/:
      - grant
      - action-log.read
      - settings.read
      - settings.manage

    corteza::automation/:
      - grant
      - settings.read
      - settings.manage

    corteza::federation/:
      - grant
      - settings.read
      - settings.manage

    corteza::system/:
      - grant
      - settings.read
      - settings.manage
      - application.create
      - applications.search
      - auth-client.create
      - auth-clients.search
      - user.create
      - users.search
      - template.create
      - templates.search
      - role.create
      - roles.search
      - reminder.assign
      - queue.create
      - queues.search
      - report.create
      - reports.search
      - agent.create
      - agents.search
      - ai-conversation.create
      - ai-conversations.search
      - chatbot.create
      - chatbots.search
      - knowledge-base.create
      - knowledge-bases.search
      - llm-provider.create
      - llm-providers.search
      - project-incident.create
      - project-incidents.search
      - project-feature.create
      - project-features.search
      - project-privacy.create
      - project-privacys.search
      - project-task.create
      - project-tasks.search
      - project-review.create
      - project-reviews.search
      - project-backlog-item.create
      - project-backlog-items.search

    corteza::system:auth-client/*:
      - read
      - update
      - delete
      - authorize

    corteza::system:application/*:
      - read
      - update
      - delete

    corteza::system:user/*:
      - read
      - update
      - suspend
      - unsuspend
      - delete

    corteza::system:role/*:
      - read
      - update
      - delete
      - members.manage

    corteza::system:report/*:
      - read
      - update
      - delete
      - run

  data-privacy-officer:
    corteza::system:data-privacy-request/*:
      - read
      - approve

    corteza::system/:
      - data-privacy-requests.search
