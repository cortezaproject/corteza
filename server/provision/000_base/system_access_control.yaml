allow:
  # Near-zero baseline: a plain logged-in user gets nothing by default beyond
  # what login itself needs. Everything else (seeing users, roles, apps, and any
  # compose data) must be granted explicitly through a role — e.g. project roles,
  # which are auto-granted access to their own project's namespace on creation.
  authenticated:
    # Required for the OAuth2/OIDC login flow to authorize the web client.
    corteza::system:auth-client/*:
      - authorize

  admin:
    corteza::system/:
      - grant
      - action-log.read
      - settings.read
      - settings.manage
      - application.create
      - applications.search
      - auth-client.create
      - auth-clients.search
      - user.create
      - users.search
      - template.create
      - templates.search
      - role.create
      - roles.search
      - reminder.assign
      - queue.create
      - queues.search
      - application.flag.global
      - apigw-route.create
      - apigw-routes.search
      - report.create
      - reports.search
      - agent.create
      - agents.search
      - ai-conversation.create
      - ai-conversations.search
      - chatbot.create
      - chatbots.search
      - knowledge-base.create
      - knowledge-bases.search
      - llm-provider.create
      - llm-providers.search

    corteza::system:auth-client/*:
      - read
      - update
      - delete
      - authorize

    corteza::system:application/*:
      - read
      - update
      - delete

    corteza::system:user/*:
      - read
      - update
      - suspend
      - unsuspend
      - delete
      - email.unmask
      - name.unmask

    corteza::system:role/*:
      - read
      - update
      - delete
      - members.manage

    corteza::system:template/*:
      - read
      - update
      - delete
      - render

    corteza::system:queue/*:
      - read
      - update
      - delete
      - queue.read
      - queue.write

    corteza::system:apigw-route/*:
      - read
      - update
      - delete

    corteza::system:report/*:
      - read
      - update
      - delete
      - run

    corteza::system:agent/*:
      - read
      - update
      - delete

    corteza::system:chatbot/*:
      - read
      - update
      - delete

    corteza::system:ai-conversation/*:
      - read
      - update
      - delete

    corteza::system:knowledge-base/*:
      - read
      - update
      - delete

    corteza::system:llm-provider/*:
      - read
      - update
      - delete

  security-admin:
