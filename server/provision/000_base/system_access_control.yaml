      - reminder.assign
      - queue.create
      - queues.search
      - report.create
      - reports.search
      - agent.create
      - agents.search
      - ai-conversation.create
      - ai-conversations.search
      - chatbot.create
      - chatbots.search
      - knowledge-base.create
      - knowledge-bases.search
