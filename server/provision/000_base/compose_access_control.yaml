allow:
  # No compose access is granted to the platform-wide "authenticated" role: a
  # plain logged-in user can't read any namespace, module, record, page or chart
  # by default. All data access is governed per project — project roles are
  # auto-granted their own namespace baseline on creation (see the role service's
  # grantProjectNamespaceAccess), and per-resource read/write is toggled in the
  # project permission matrix.
  admin:
    corteza::compose/:
      - grant
      - settings.read
      - settings.manage
      - namespace.create
      - namespaces.search

    corteza::compose:namespace/*:
      - read
      - update
      - delete
      - manage
      - export
      - modules.export
      - charts.export
      - pages.export
      - page.create
      - pages.search
      - module.create
      - modules.search
      - chart.create
      - charts.search

    corteza::compose:module/*/*:
      - read
      - update
      - delete
      - export
      - record.create
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read
      - record.value.update

    corteza::compose:record/*/*/*:
      - read
      - update
      - delete
      - revisions.search

    corteza::compose:chart/*/*:
      - read
      - update
      - delete
      - export

    corteza::compose:page/*/*:
      - read
      - update
      - delete
      - export

    corteza::compose:page-layout/*/*/*:
      - read
      - update
      - delete

  # Agents automatically retain full access to resources they created.
  # Membership is contextual (see the agent-creator role), so these grants
  # only apply to namespaces, modules and records whose createdByAgent
  # matches the invoking agent.
  agent-creator:
    corteza::compose:namespace/*:
      - read
      - update
      - delete
      - manage
      - export
      - modules.export
      - charts.export
      - pages.export
      - page.create
      - pages.search
      - module.create
      - modules.search
      - chart.create
      - charts.search

    corteza::compose:module/*/*:
      - read
      - update
      - delete
      - export
      - record.create
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read
      - record.value.update

    corteza::compose:record/*/*/*:
      - read
      - update
      - delete
      - revisions.search

    corteza::compose:page/*/*:
      - read
      - update
      - delete
      - export

    corteza::compose:page-layout/*/*/*:
      - read
      - update
      - delete

  low-code-admin:
    corteza::compose/:
      - grant
      - settings.read
      - settings.manage
      - namespace.create
      - namespaces.search

    corteza::compose:namespace/*:
      - read
      - update
      - delete
      - manage
      - export
      - modules.export
      - charts.export
      - pages.export
      - page.create
      - pages.search
      - module.create
      - modules.search
      - chart.create
      - charts.search

    corteza::compose:module/*/*:
      - read
      - update
      - delete
      - export
      - record.create
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read
      - record.value.update

    corteza::compose:record/*/*/*:
      - read
      - update
      - delete

    corteza::compose:chart/*/*:
      - read
      - update
      - delete
      - export

    corteza::compose:page/*/*:
      - read
      - update
      - delete
      - export
