allow:
  # No compose access is granted to the platform-wide "authenticated" role: a
  # plain logged-in user can't read any namespace, module, record, page or chart
  # by default. All data access is governed per project, by the rules the
  # project permission matrix writes against that project's own namespace.
  # Nothing grants a project role anything on its own.
  admin:
    corteza::compose/:
      - grant
      - settings.read
      - settings.manage
      - namespace.create
      - email-notifications.send
      - namespaces.search
      - resource-translations.manage

    corteza::compose:namespace/*:
      - read
      - update
      - delete
      - manage
      - export
      - modules.export
      - charts.export
      - page.create
      - pages.search
      - module.create
      - modules.search
      - chart.create
      - charts.search

    corteza::compose:module/*/*:
      - read
      - update
      - delete
      - record.create
      - owned-record.create
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read
      - record.value.update

    corteza::compose:record/*/*/*:
      - read
      - update
      - delete
      - undelete
      - owner.manage
      - revisions.search

    corteza::compose:chart/*/*:
      - read
      - update
      - delete

    corteza::compose:page/*/*:
      - read
      - update
      - delete
      - page-layout.create
      - page-layouts.search

    corteza::compose:page-layout/*/*/*:
      - read
      - update
      - delete

  # Agents automatically retain full access to resources they created.
  # Membership is contextual (see the agent-creator role), so these grants
  # only apply to namespaces, modules and records whose createdByAgent
  # matches the invoking agent.
  agent-creator:
    corteza::compose:namespace/*:
      - read
      - update
      - delete
      - manage
      - export
      - modules.export
      - charts.export
      - page.create
      - pages.search
      - module.create
      - modules.search
      - chart.create
      - charts.search

    corteza::compose:module/*/*:
      - read
      - update
      - delete
      - record.create
      - owned-record.create
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read
      - record.value.update

    corteza::compose:record/*/*/*:
      - read
      - update
      - delete
      - undelete
      - owner.manage
      - revisions.search

    # An agent may create a chart on a namespace it owns, so it holds the chart
    # itself too; the role's context lists corteza::compose:chart for the same
    # reason.
    corteza::compose:chart/*/*:
      - read
      - update
      - delete

    corteza::compose:page/*/*:
      - read
      - update
      - delete
      - page-layout.create
      - page-layouts.search

    corteza::compose:page-layout/*/*/*:
      - read
      - update
      - delete

  low-code-admin:
    corteza::compose/:
      - grant
      - settings.read
      - settings.manage
      - namespace.create
      - email-notifications.send
      - namespaces.search
      - resource-translations.manage

    corteza::compose:namespace/*:
      - read
      - update
      - delete
      - manage
      - export
      - modules.export
      - charts.export
      - page.create
      - pages.search
      - module.create
      - modules.search
      - chart.create
      - charts.search

    corteza::compose:module/*/*:
      - read
      - update
      - delete
      - record.create
      - owned-record.create
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read
      - record.value.update

    corteza::compose:record/*/*/*:
      - read
      - update
      - delete
      - undelete
      - owner.manage
      - revisions.search

    corteza::compose:chart/*/*:
      - read
      - update
      - delete

    corteza::compose:page/*/*:
      - read
      - update
      - delete
      - page-layout.create
      - page-layouts.search

    corteza::compose:page-layout/*/*/*:
      - read
      - update
      - delete

deny:
  # The compose half of the baseline an earlier install gave every logged-in
  # user: read on every namespace, module, record, page, chart and layout, and
  # the namespace export that dumps all of it at once. Provisioning only ever
  # adds rules, so an install that once carried them keeps them until something
  # takes them back — the same reason the system config carries its own deny
  # block. Role holders are unaffected: a common or context role returns on its
  # own allow before the authenticated tier is read
  # (pkg/rbac/ruleset_checks.go).
  authenticated:
    corteza::compose/:
      - namespaces.search

    corteza::compose:namespace/*:
      - read
      - export
      - modules.search
      - modules.export
      - charts.search
      - charts.export
      - pages.search

    corteza::compose:module/*/*:
      - read
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read

    corteza::compose:record/*/*/*:
      - read

    corteza::compose:chart/*/*:
      - read

    corteza::compose:page/*/*:
      - read

    corteza::compose:page-layout/*/*/*:
      - read
