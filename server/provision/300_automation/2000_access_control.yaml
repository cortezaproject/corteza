allow:
  admin:
    corteza::automation/:
      - grant
      - workflow.create
      - workflows.search
      - triggers.search
      - sessions.search
      - resource-translations.manage
      # The TAQ builder's own resource; its admin screen was reachable but its
      # list endpoint was not.
      - ng-automation.create
      - ng-automations.search

    corteza::automation:workflow/*:
      - read
      - update
      - delete
      - undelete
      - execute
      - triggers.manage
      - sessions.manage

    corteza::automation:ng-automation/*:
      - read
      - update
      - delete
      - undelete
      - execute

  developer:
    corteza::automation/:
      - grant
      - workflow.create
      - workflows.search
      - triggers.search
      - sessions.search
      - resource-translations.manage
      # The TAQ builder's own resource; its admin screen was reachable but its
      # list endpoint was not.
      - ng-automation.create
      - ng-automations.search

    corteza::automation:workflow/*:
      - read
      - update
      - delete
      - undelete
      - execute
      - triggers.manage
      - sessions.manage

    corteza::automation:ng-automation/*:
      - read
      - update
      - delete
      - undelete
      - execute

    # Opening the webapp that carries the workflow and TAQ builders is a system
    # operation; without it the tile is unreachable for the role the section
    # belongs to.
    corteza::system:application/*:
      - read
      - access
