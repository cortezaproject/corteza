allow:
  admin:
    corteza::automation/:
      - grant
      - workflow.create
      - workflows.search
      - triggers.search
      - sessions.search
      # The TAQ builder's own resource; its admin screen was reachable but its
      # list endpoint was not.
      - ng-automation.create
      - ng-automations.search

    corteza::automation:workflow/*:
      - read
      - update
      - delete
      - undelete
      - execute
      - triggers.manage
      - sessions.manage

  developer:
    corteza::automation/:
      - grant
      - workflow.create
      - workflows.search
      - triggers.search
      - sessions.search
      # The TAQ builder's own resource; its admin screen was reachable but its
      # list endpoint was not.
      - ng-automation.create
      - ng-automations.search

    corteza::automation:workflow/*:
      - read
      - update
      - delete
      - undelete
      - execute
      - triggers.manage
      - sessions.manage
