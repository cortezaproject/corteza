<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  body { margin: 0; padding: 12px 16px; font: 14px/1.4 system-ui, sans-serif; color: CanvasText; background: transparent; }
  .muted { opacity: .65; font-size: 12px; }
</style>
</head>
<body>
<div id="title">Human records</div>
<div id="status" class="muted">Waiting for the lookup…</div>
<script>
  // MCP Apps view, protocol 2026-01-26: JSON-RPC over postMessage to the host.
  let nextId = 1
  const pending = {}

  function send (msg) { window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*') }
  function request (method, params) {
    const id = nextId++
    send({ id, method, params })
    return new Promise(resolve => { pending[id] = resolve })
  }
  function notify (method, params) { send({ method, params }) }

  function reportSize () {
    notify('ui/notifications/size-changed', { height: document.documentElement.scrollHeight })
  }

  function render (result) {
    const data = result.structuredContent || {}
    // A list carries 'records'; a lookup by recordID returns the record itself.
    const records = Array.isArray(data.records) ? data.records : (data.recordID ? [data] : [])
    document.getElementById('status').textContent =
      records.length + (records.length === 1 ? ' record' : ' records') + (data.nextPageCursor ? ', more available' : '')
    reportSize()
  }

  window.addEventListener('message', e => {
    const msg = e.data
    if (!msg || msg.jsonrpc !== '2.0') return

    if (msg.id !== undefined && !msg.method) {
      const done = pending[msg.id]
      delete pending[msg.id]
      if (done) done(msg.result)
      return
    }

    switch (msg.method) {
      case 'ui/notifications/tool-result':
        render(msg.params || {})
        break
      case 'ping':
      case 'ui/resource-teardown':
        send({ id: msg.id, result: {} })
        break
    }
  })

  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'human-record-lookup', version: '0.1.0' },
    appCapabilities: {},
  }).then(() => {
    notify('ui/notifications/initialized', {})
    reportSize()
  })
</script>
</body>
</html>
