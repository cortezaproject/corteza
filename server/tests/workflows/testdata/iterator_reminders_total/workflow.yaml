workflows:
  testing:
    enabled: true
    trace: true
    triggers:
      - enabled: true
        stepID: 10

    steps:
      - stepID: 10
        kind: iterator
        ref: remindersEach
        arguments:
          - { "target": "incTotal", "value": "true", "type": "Boolean" }
        results:
          - { "target": "r", "expr": "reminder" }
          - { "target": "t", "expr": "total" }

      - stepID: 11
        kind: continue

      - stepID: 12
        kind: termination

    paths:
      - { parentID: 10, childID: 11 }
      - { parentID: 10, childID: 12 }
