services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: human
      POSTGRES_PASSWORD: human
      POSTGRES_DB: human
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U human']
      interval: 5s
      retries: 10

  human:
    image: planetcrust/human:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      corredor:
        condition: service_started
    ports:
      - '8080:80'
    environment:
      DB_DSN: postgres://human:human@db:5432/human?sslmode=disable
      DOMAIN: localhost:8080
      # Any long random string. Keeps sessions valid when the container is recreated.
      AUTH_JWT_SECRET: replace-me-with-a-long-random-string
      CORREDOR_ENABLED: 'true'
    volumes:
      - data:/data

  corredor:
    image: planetcrust/human-corredor:latest
    restart: unless-stopped
    environment:
      CORREDOR_EXEC_CTX_FRONTEND_BASEURL: http://localhost:8080
    volumes:
      # Automation scripts: one folder per extension, each with server-scripts/ and client-scripts/
      - ./scripts:/corredor/usr

volumes:
  db:
  data:
