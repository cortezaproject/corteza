name: intent
on:
  pull_request:
  push:
    branches: ['2026.*.x', 'feature-*']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: intent check
        run: node .intent/intent.mjs check
      - name: intent coverage
        run: node .intent/intent.mjs coverage
