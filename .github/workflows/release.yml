name: 'Release'

on:
  push:
    tags:
      - '**'

env:
  BUILD_OS: linux
  BUILD_ARCH: amd64

  GO_VERSION: 1.24.1
  GOFLAGS: -mod=readonly

  NODE_VERSION: 22
  PNPM_VERSION: 10

  SASS_VERSION: 1.85.1

jobs:
  ########################################################################################################################
  # Server

  # server-test:
  #   name: 'Server tests'
  #   runs-on: ubuntu-22.04
  #   env:
  #     GOFLAGS: -mod=readonly
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-go@v5
  #       with: { go-version: '${{ env.GO_VERSION }}' }
  #     - name: 'Copy language files'
  #       working-directory: server/pkg/locale
  #       run: make src/en
  #     - name: 'Unit'
  #       working-directory: server
  #       run: make test.unit
  #     - name: 'Store'
  #       working-directory: server
  #       run: make test.store
  #     - name: 'Integration'
  #       working-directory: server
  #       run: make test.integration

  server-web-console-build:
    name: 'Server Web Console Build'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/cache@v4
        if: ${{ !env.ACT }}
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('server/webconsole/yarn.lock') }}
          restore-keys: ${{ runner.OS }}-node-
      - name: 'Setup YARN'
        run: npm install -g yarn @vue/cli-service
      - name: 'Install dependencies'
        working-directory: server/webconsole
        run: yarn install
      - name: 'Build Package'
        working-directory: server/webconsole
        run: yarn build
      - name: 'Upload webconsole dist'
        uses: actions/upload-artifact@v4
        with:
          name: webconsole-dist
          path: server/webconsole/dist

  server-build:
    name: 'Server Build'
    runs-on: ubuntu-22.04
    needs: [server-web-console-build]
    steps:
      - run: echo "BUILD_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - name: 'Download webconsole dist'
        uses: actions/download-artifact@v4
        with:
          name: webconsole-dist
          path: server/webconsole/dist
      - name: 'Copy essentials'
        run: cp *.md DCO LICENSE server/
      - name: 'Copy language files'
        working-directory: server/pkg/locale
        run: make src/en
      - name: 'Build server binary'
        working-directory: server
        run: make release-clean release
      - name: 'Upload server build'
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: server/build/pkg/human-server

  ########################################################################################################################
  # Libs

  lib-test:
    name: 'Library tests'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: 'Install dependencies'
        run: pnpm install
      - name: 'Test lib/js'
        working-directory: lib/js
        run: pnpm test:unit

  # lib/vue has no build or test scripts — it exports TypeScript source directly.
  # Both libs are resolved via workspace:* protocol in the monorepo.

  ########################################################################################################################
  # Web clients

  client-web-build:
    name: 'Web client build (${{ matrix.app }})'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix: { app: [admin, agentic, compose, one, taq, workflow] }
    needs: ['lib-test']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: 'Dependencies'
        run: pnpm install
      - name: 'Build'
        working-directory: client/web/${{ matrix.app }}
        run: pnpm build
      - name: 'Upload web app build'
        uses: actions/upload-artifact@v4
        with:
          name: webapp-${{ matrix.app }}
          path: client/web/${{ matrix.app }}/dist

  ########################################################################################################################
  # Docker images

  docker-images:
    name: 'Docker image planetcrust/human'
    runs-on: ubuntu-22.04
    needs: [server-build, client-web-build]
    steps:
      - uses: actions/checkout@v4

      - name: 'Download server build'
        uses: actions/download-artifact@v4
        with:
          name: server-build
          path: .docker-build/server

      - name: 'Download all webapp builds'
        uses: actions/download-artifact@v4
        with:
          pattern: webapp-*
          path: .docker-build/webapp
          merge-multiple: false

      - name: 'Arrange webapp files'
        run: |
          mkdir -p .docker-build/webapp-merged
          for app in admin agentic compose one taq workflow; do
            if [ -d ".docker-build/webapp/webapp-${app}" ]; then
              if [ "$app" = "one" ]; then
                cp -r .docker-build/webapp/webapp-${app}/* .docker-build/webapp-merged/
              else
                mkdir -p .docker-build/webapp-merged/${app}
                cp -r .docker-build/webapp/webapp-${app}/* .docker-build/webapp-merged/${app}/
              fi
            fi
          done

      - name: 'Parse version tag'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "DOCKER_IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          if [[ "$(echo ${TAG} | grep '-')" == "" ]]; then
            echo "DOCKER_IMAGE_ALIAS=$(echo ${TAG} | cut -d '.' -f -2)" >> $GITHUB_ENV
          fi

      - name: 'Build'
        run: |
          docker build \
            --build-arg "VERSION=${{ env.DOCKER_IMAGE_TAG }}" \
            --build-arg "SASS_VERSION=${{ env.SASS_VERSION }}" \
            --tag planetcrust/human:${{ env.DOCKER_IMAGE_TAG }} \
            .

      - name: 'Login'
        uses: docker/login-action@v3
        if: ${{ !env.ACT && env.DOCKER_IMAGE_TAG }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Push ${{ env.DOCKER_IMAGE_TAG }}'
        if: ${{ !env.ACT }}
        run: docker push planetcrust/human:${{ env.DOCKER_IMAGE_TAG }}

      - name: 'Push ${{ env.DOCKER_IMAGE_ALIAS }}'
        if: ${{ !env.ACT && env.DOCKER_IMAGE_ALIAS }}
        run: |
          docker tag \
            planetcrust/human:${{ env.DOCKER_IMAGE_TAG }} \
            planetcrust/human:${{ env.DOCKER_IMAGE_ALIAS }}
          docker push planetcrust/human:${{ env.DOCKER_IMAGE_ALIAS }}
