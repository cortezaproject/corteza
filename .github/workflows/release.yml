name: 'Release'

# These jobs can be tested with nektos/act tool
# https://github.com/nektos/act
#
# Look for "!env.ACT" in the DRY_RUN expression below

on:
  push:
    tags:
      - '**'

env:
  BUILD_OS: linux
  BUILD_ARCH: amd64

  GO_VERSION: 1.24.1
  GOFLAGS: -mod=readonly

  NODE_VERSION: 22
  PNPM_VERSION: 10

  RELEASE_BASE_URL: 'https://releases.cortezaproject.org/files'
  SASS_VERSION: 1.85.1

jobs:
  server-test:
    name: 'Server tests'
    runs-on: ubuntu-22.04
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - name: 'Copy language files'
        working-directory: server/pkg/locale
        run: make src/en
      - name: 'Unit'
        working-directory: server
        run: make test.unit
      - name: 'Store'
        working-directory: server
        run: make test.store
      - name: 'Integration'
        working-directory: server
        run: make test.integration

  # Building web console for server and cache it for release-* steps
  # we'll do this in parallel with tests to gain a few seconds
  server-web-console-build:
    name: 'Server Web Console Build'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/cache@v4
        if: ${{ !env.ACT }}
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('server/webconsole/yarn.lock') }}
          restore-keys: ${{ runner.OS }}-node-
      - name: 'Setup YARN'
        run: npm install -g yarn @vue/cli-service
      - name: 'Install dependencies'
        working-directory: server/webconsole
        run: yarn install
      - name: 'Build Package'
        working-directory: server/webconsole
        run: yarn build
      - name: 'Cache console build'
        uses: actions/cache@v4
        with: { path: ./server/webconsole/dist, key: console-build }

  server-release:
    name: 'Server Release (${{ matrix.os }})'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runsOn: 'ubuntu-22.04', os: 'linux' }
          - { runsOn: 'macos-latest', os: 'darwin' }
    runs-on: ${{ matrix.runsOn }}
    needs: [server-web-console-build, server-test]
    env:
      BUILD_OS: ${{ matrix.os }}
      RELEASE_SFTP_KEY: ${{ secrets.RELEASE_SFTP_KEY }}
      RELEASE_SFTP_URI: ${{ secrets.RELEASE_SFTP_URI }}
    steps:
      - run: echo "BUILD_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - name: 'Restore web console dist from cache'
        uses: actions/cache@v4
        with: { path: ./server/webconsole/dist, key: console-build }
      - name: 'Copy essentials'
        run: cp *.md DCO LICENSE server/
      - name: 'Copy language files'
        working-directory: server/pkg/locale
        run: make src/en src/de src/fr
      - name: 'Build'
        working-directory: server
        run: make release-clean release
      - name: 'Upload'
        working-directory: server
        run: make upload
        if: ${{ !env.ACT }}

  ########################################################################################################################
  ########################################################################################################################
  # Libs

  lib-test:
    name: 'Library tests'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: 'Install dependencies'
        run: pnpm install
      - name: 'Test lib/js'
        working-directory: lib/js
        run: pnpm test:unit

  # lib/vue has no build or test scripts — it exports TypeScript source directly.
  # Both libs are resolved via workspace:* protocol in the monorepo.
  # No npm publishing is needed — Vite compiles lib TypeScript on-the-fly.

  ########################################################################################################################
  ########################################################################################################################
  # Web clients

  client-web-test:
    name: 'Web client test (${{ matrix.app }})'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix: { app: [admin, agentic, compose, one, taq] }
    needs: ['lib-test']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: 'Dependencies'
        run: pnpm install
      - name: 'Tests'
        working-directory: client/web/${{ matrix.app }}
        run: pnpm test:unit

  client-web-release:
    name: 'Web client (${{ matrix.app }})'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix: { app: [admin, agentic, compose, one, taq] }
    needs: [client-web-test]
    env:
      RELEASE_SFTP_KEY: ${{ secrets.RELEASE_SFTP_KEY }}
      RELEASE_SFTP_URI: ${{ secrets.RELEASE_SFTP_URI }}
    steps:
      - run: echo "BUILD_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: 'Dependencies'
        run: pnpm install
      - name: 'Build'
        working-directory: client/web/${{ matrix.app }}
        run: pnpm build
      - name: 'Copy essentials'
        run: cp *.md DCO LICENSE client/web/${{ matrix.app }}
      - name: 'Release'
        working-directory: client/web/${{ matrix.app }}
        run: make release
      - name: 'Upload'
        working-directory: client/web/${{ matrix.app }}
        run: make upload
        if: ${{ !env.ACT }}

  ########################################################################################################################

  client-web-aio-release:
    name: 'Web clients (all-in-one release)'
    runs-on: ubuntu-22.04
    needs: [client-web-release]
    env:
      RELEASE_SFTP_KEY: ${{ secrets.RELEASE_SFTP_KEY }}
      RELEASE_SFTP_URI: ${{ secrets.RELEASE_SFTP_URI }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "BUILD_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: 'Prepare dist dir'
        run: |
          mkdir -p \
            client/web/dist/admin \
            client/web/dist/agentic \
            client/web/dist/compose \
            client/web/dist/taq
      - name: 'Download & unpack one'
        run: |
          curl --location "${{ env.RELEASE_BASE_URL }}/human-webapp-one-${{ env.BUILD_VERSION }}.tar.gz" | \
            tar -xzmok -C client/web/dist
      - name: 'Download & unpack admin'
        run: |
          curl --silent --location "${{ env.RELEASE_BASE_URL }}/human-webapp-admin-${{ env.BUILD_VERSION }}.tar.gz" | \
            tar -xzmok -C client/web/dist/admin
      - name: 'Download & unpack agentic'
        run: |
          curl --silent --location "${{ env.RELEASE_BASE_URL }}/human-webapp-agentic-${{ env.BUILD_VERSION }}.tar.gz" | \
            tar -xzmok -C client/web/dist/agentic
      - name: 'Download & unpack compose'
        run: |
          curl --silent --location "${{ env.RELEASE_BASE_URL }}/human-webapp-compose-${{ env.BUILD_VERSION }}.tar.gz" | \
            tar -xzmok -C client/web/dist/compose
      - name: 'Download & unpack taq'
        run: |
          curl --silent --location "${{ env.RELEASE_BASE_URL }}/human-webapp-taq-${{ env.BUILD_VERSION }}.tar.gz" | \
            tar -xzmok -C client/web/dist/taq
      - name: 'Copy essentials'
        run: cp *.md DCO LICENSE client/web/dist/
      - name: 'Pack all web clients'
        working-directory: client/web
        run: tar -C dist -czf human-webapp-${{ env.BUILD_VERSION }}.tar.gz $(dir dist)
      - name: 'Upload'
        working-directory: client/web
        run: |
          echo ${{ env.RELEASE_SFTP_KEY }} | base64 -d > .upload-rsa && chmod 0400 .upload-rsa
          echo "put human-webapp-${{ env.BUILD_VERSION }}.tar.gz" | \
            sftp -q -o "StrictHostKeyChecking no" -i .upload-rsa ${{ env.RELEASE_SFTP_URI }}
          rm -f .upload-rsa
        if: ${{ !env.ACT }}

  ########################################################################################################################
  ########################################################################################################################
  # This is where it all comes together

  release:
    name: 'Human (${{ matrix.os }})'
    runs-on: ubuntu-22.04
    needs: [server-release, client-web-aio-release]
    strategy:
      fail-fast: true
      matrix:
        os: ['linux']
    env:
      ENDPOINT: https://releases.cortezaproject.org/files
      RELEASE_SFTP_KEY: ${{ secrets.RELEASE_SFTP_KEY }}
      RELEASE_SFTP_URI: ${{ secrets.RELEASE_SFTP_URI }}
    steps:
      - run: echo "BUILD_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: 'Download'
        run: |
          curl --silent --location "${{ env.RELEASE_BASE_URL }}/human-server-${{ env.BUILD_VERSION }}-${{ matrix.os }}-amd64.tar.gz" | \
            tar -xzmok -C .
          mv human-server dist
          rm -rf dist/webapp
          mkdir dist/webapp
          curl --silent --location "${{ env.RELEASE_BASE_URL }}/human-webapp-${{ env.BUILD_VERSION }}.tar.gz" | \
            tar -xzmok -C dist/webapp
      - name: 'Pack'
        run: |
          tar -C dist -czf human-${{ env.BUILD_VERSION }}-linux-amd64.tar.gz $(dir dist)
      - name: 'Upload'
        run: |
          echo ${{ env.RELEASE_SFTP_KEY }} | base64 -d > .upload-rsa
          chmod 0400 .upload-rsa
          echo "put human-${{ env.BUILD_VERSION }}-linux-amd64.tar.gz" | \
            sftp -q -o "StrictHostKeyChecking no" -i .upload-rsa ${{ env.RELEASE_SFTP_URI }}
          rm -f .upload-rsa
        if: ${{ !env.ACT }}

  ########################################################################################################################
  ########################################################################################################################

  docker-images:
    name: 'Docker image ${{ matrix.image }}'

    runs-on: ubuntu-22.04
    needs:
      - server-release
      - client-web-aio-release
    strategy:
      fail-fast: true
      matrix:
        include:
          - { context: 'client/web', image: 'crusttech/human-webapp' }
          - { context: 'server', image: 'crusttech/human-server' }
          - { context: '.', image: 'crusttech/human' }

    steps:
      - uses: actions/checkout@v4
      - name: 'Parse version tag'
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          echo "DOCKER_IMAGE_TAG=${TAG}" >> $GITHUB_ENV

          if [[ "$(echo ${TAG} | grep '-')" == "" ]]; then
            # when releasing patched version (YYYY.MM.PATCH) we
            # tag alias (YYYY.MM) as well
            echo "DOCKER_IMAGE_ALIAS=$(echo ${TAG} | cut -d '.' -f -2)" >> $GITHUB_ENV
          fi

      - name: 'Build'
        run: |
          docker build \
            --build-arg "VERSION=${{ env.DOCKER_IMAGE_TAG }}" \
            --build-arg "SASS_VERSION=${{ env.SASS_VERSION }}" \
            --tag ${{ matrix.image }}:${{ env.DOCKER_IMAGE_TAG }} \
            ${{ matrix.context }}

      - name: 'Login'
        uses: docker/login-action@v3
        if: ${{ !env.ACT && env.DOCKER_IMAGE_TAG }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Push ${{ env.DOCKER_IMAGE_TAG }}'
        if: ${{ !env.ACT }}
        run: |
          docker push \
            ${{ matrix.image }}:${{ env.DOCKER_IMAGE_TAG }}

      - name: 'Push ${{ env.DOCKER_IMAGE_ALIAS }}'
        if: ${{ !env.ACT && env.DOCKER_IMAGE_ALIAS }}
        run: |
          docker tag \
            ${{ matrix.image }}:${{ env.DOCKER_IMAGE_TAG }} \
            ${{ matrix.image }}:${{ env.DOCKER_IMAGE_ALIAS }}

          docker push \
            ${{ matrix.image }}:${{ env.DOCKER_IMAGE_ALIAS }}
