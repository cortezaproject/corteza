name: "Server and lib tests"

# These jobs can be tested with nektos/act tool
# https://github.com/nektos/act
#
# Look for "!env.ACT" in the DRY_RUN expression below

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - '20[0-9][0-9].[0-9].x'
      - '20[0-9][0-9].[0-9].[0-9]'

env:
  BUILD_OS: linux
  BUILD_ARCH: amd64

  GO_VERSION: 1.24.1
  GOFLAGS: -mod=readonly
  WORKFLOW_STACK_TRACE_FULL: true

  NODE_VERSION: 22

jobs:
  c311-fe01:
    name: "C311 FE-00/FE-01 release gates"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: "Enable Corepack"
        run: corepack enable
      - name: "Install Python browser test dependencies"
        run: |
          python3 -m pip install -r tools/c311-browser/requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: "Build and install current C311 packages"
        run: tools/ci/install-local-c311-packages.sh
      - name: "lib/js unit, types and build"
        run: |
          corepack yarn --cwd lib/js install --frozen-lockfile
          corepack yarn --cwd lib/js test:unit
          corepack yarn --cwd lib/js exec tsc --noEmit
          corepack yarn --cwd lib/js build
      - name: "lib/vue unit and build"
        run: |
          corepack yarn --cwd lib/vue install --frozen-lockfile
          corepack yarn --cwd lib/vue test:unit
          corepack yarn --cwd lib/vue build
      - name: "Compose and Admin C311 component tests"
        run: |
          corepack yarn --cwd client/web/compose test:c311
          corepack yarn --cwd client/web/admin test:c311
      - name: "Compose and Admin production builds"
        run: |
          cp client/web/compose/public/config.example.js client/web/compose/public/config.js
          cp client/web/admin/public/config.example.js client/web/admin/public/config.js
          corepack yarn --cwd client/web/compose build
          corepack yarn --cwd client/web/admin build
      - name: "FE-01 browser matrix"
        run: tools/c311-browser/run.sh
        env:
          C311_ARTIFACT_DIR: ${{ runner.temp }}/c311-fe01-gate
      - name: "Upload C311 gate evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c311-fe01-gate
          path: ${{ runner.temp }}/c311-fe01-gate
          if-no-files-found: ignore

  lib-test:
    name: "Library test (${{ matrix.lib }})"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        lib: [ "js", "vue" ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/cache@v3
        if: ${{ !env.ACT }}
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.OS }}-node-${{ matrix.lib }}
      - name: "Setup YARN"
        run: npm install -g yarn @vue/cli-service
      - name: "Install dependencies"
        working-directory: lib/${{ matrix.lib }}
        run: yarn install
      - name: "Run all tests"
        working-directory: lib/${{ matrix.lib }}
        run: yarn test:unit

  client-web-test:
    name: "Web client test (${{ matrix.app }})"
    runs-on: ubuntu-22.04
    strategy:
      matrix: { app: [ admin, compose, discovery, privacy, reporter, one, workflow ] }
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: "Setup YARN"
        working-directory: client/web/${{ matrix.app }}
        run: npm install -g yarn @vue/cli-service
      - name: "Cache"
        uses: actions/cache@v3
        if: ${{ !env.ACT }}
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.OS }}-node-
      - name: "Dependencies"
        working-directory: client/web/${{ matrix.app }}
        run: make dep
      - name: "Tests"
        working-directory: client/web/${{ matrix.app }}
        run: make test

  server-test:
    name: "Server tests"
    runs-on: ubuntu-22.04
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with: { go-version: "${{ env.GO_VERSION }}" }
      - name: "Copy language files"
        working-directory: server/pkg/locale
        run: make src/en
      - name: "Unit"
        working-directory: server
        run: make test.unit
      - name: "Store"
        working-directory: server
        run: make test.store
      - name: "Integration"
        working-directory: server
        run: make test.integration

  notify:
    if: failure()
    name: "Send matrix testing notification"
    runs-on: ubuntu-22.04
    needs: [ server-test, client-web-test, lib-test ]
    steps:
      - name: "Send message via Matrix on failed tests"
        if: ${{ !env.ACT && failure() }}
        id: matrix-chat-tests-failed
        uses: fadenb/matrix-chat-message@v0.0.6
        with:
          homeserver: ${{ secrets.MATRIX_HOME_SERVER }}
          token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          channel: ${{ secrets.MATRIX_ROOM_ID }}
          message: |
            # Corteza **${GITHUB_REF##*/}** tests have failed
